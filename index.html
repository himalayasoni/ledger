const MAX_AMOUNT = 1e9; // 100 crore. A bigger number is a mishearing, not an amount.
const MONTH_NO = new Map(Object.entries({jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,sep:9,sept:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12}));
const WEEKDAY_NO = new Map(Object.entries({sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,wednesday:3,thu:4,thur:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6}));
const MONTH_RE = '(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sept|sep|oct|nov|dec)';
// Capital letter at the start of each word: "neha gupta" -> "Neha Gupta", "o'brien" -> "O'Brien", "josé" -> "José".
const titleCase = s => s.replace(/(^|[^\p{L}\p{M}\p{N}_])(\p{L})/gu, (_, before, c) => before + c.toUpperCase());
function lev(a, b){
  const d = Array.from({length: a.length + 1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
function matchPerson(n){
  const l = (n || '').toLowerCase().trim(); if (!l) return '';
  const ppl = allPeople(), first = p => p.toLowerCase().split(' ')[0];
  return ppl.find(p => p.toLowerCase() === l) || ppl.find(p => first(p) === l)
    || (l.length >= 4 && !l.includes(' ') ? ppl.find(p => lev(first(p), l) <= 1) : '') || '';
}
// Exactly someone you've used before, by full or first name (no spelling slack): "ola" is a cab unless you know an Ola.
const isKnown = n => allPeople().some(p => p.toLowerCase() === n || p.toLowerCase().split(' ')[0] === n);
function numberize(t){
  const toks = t.trim().split(' '), out = [];
  let total = 0, cur = 0, any = false, lastDigit = false;
  const flush = () => {
    if (any){ const n = Math.round((total + cur) * 100) / 100; out.push(n > MAX_AMOUNT ? '0' : String(n)); } // too big counts as no amount
    total = 0; cur = 0; any = false; lastDigit = false;
  };
  for (let i = 0; i < toks.length; i++){
    const w = toks[i], nx = toks[i + 1] || '';
    if (/^\d+(\.\d+)?$/.test(w)){ if (any && lastDigit) flush(); cur += parseFloat(w); any = true; lastDigit = true; continue; }
    if (SMALLN.has(w)){ cur += SMALLN.get(w); any = true; lastDigit = false; continue; }
    if (w === 'a' && (nx === 'hundred' || nx === 'thousand' || nx === 'lakh')){ cur += 1; any = true; continue; }
    if (MULTN.has(w) && any){ if (w === 'hundred') cur *= 100; else { total += cur * MULTN.get(w); cur = 0; } lastDigit = false; continue; }
    // "two hundred and fifty" is one number; "100 and 50" stays two
    if (w === 'and' && any && (SMALLN.has(nx) || (!lastDigit && /^\d/.test(nx)))) continue;
    flush(); out.push(w);
  }
  flush();
  return ' ' + out.join(' ') + ' ';
}

/* Dates. Worked out on day numbers (days since 1 Jan 1970) so clocks and time zones never matter.
   Each rule turns a match into "days ago", or null when it isn't a real date (31 feb). */
const dayNo = (y, m, d) => Math.round(Date.UTC(y, m - 1, d) / 864e5);
const monthDays = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
function readDate(t, today){
  const [ty, tm, td] = String(today).split('-').map(Number), T = dayNo(ty, tm, td);
  const ago = (y, m, d) => (m >= 1 && m <= 12 && d >= 1 && d <= monthDays(y, m)) ? T - dayNo(y, m, d) : null;
  // a day and month without a year: this year's, or last year's if this year's hasn't come yet
  // (29 feb goes back to the last leap year)
  const dayMonth = (d, m) => {
    let y = m > tm || (m === tm && d > td) ? ty - 1 : ty;
    for (let tries = 0; tries < 8; tries++, y--){ const days = ago(y, m, d); if (days !== null) return days; }
    return null;
  };
  // a weekday: the latest one up to today ("on monday" said on a Monday is today); "last monday" is never today
  const weekday = (name, last) => { const back = ((T + 4) % 7 - WEEKDAY_NO.get(name) + 7) % 7; return back === 0 && last ? 7 : back; };
  // a day of the month alone ("on the 3rd"): this month's if it has come, else the month before (or the one before that)
  const dayOnly = d => {
    for (let k = 0; k < 3; k++){
      const y = tm - k < 1 ? ty - 1 : ty, m = (tm - k + 11) % 12 + 1;
      if (d >= 1 && d <= monthDays(y, m) && (k > 0 || d <= td)) return T - dayNo(y, m, d);
    }
    return null;
  };
  const RULES = [
    [/\bday before yesterday\b/, () => 2],
    [/\byesterday\b/, () => 1],
    [/\b(\d{1,3}) days? ago\b/, m => Number(m[1])],
    [/\b(on |last |this |on last |on this )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/, m => weekday(m[2], /last/.test(m[1] || ''))],
    [/\b(on |last |this |on last |on this )(sun|mon|tues|tue|wed|thurs|thur|thu|fri|sat)\b/, m => weekday(m[2], /last/.test(m[1]))], // short names need "on"/"last"
    [/\b(?:on )?(\d{1,2})\/(\d{1,2})\/(\d{4}|\d{2})\b/, m => ago(Number(m[3]) < 100 ? 2000 + Number(m[3]) : Number(m[3]), Number(m[2]), Number(m[1]))], // 03/11/2026, day first
    [/\bon (\d{1,2})\/(\d{1,2})\b(?!\/)/, m => dayMonth(Number(m[1]), Number(m[2]))], // on 03/11
    [new RegExp('\\b(?:on )?(?:the )?(\\d{1,2})(?:st|nd|rd|th)? (?:of )?' + MONTH_RE + '\\b'), m => dayMonth(Number(m[1]), MONTH_NO.get(m[2]))], // 3rd nov, 3 november
    [new RegExp('\\b(?:on )?' + MONTH_RE + ' (?:the )?(\\d{1,2})(?:st|nd|rd|th)?\\b'), m => dayMonth(Number(m[2]), MONTH_NO.get(m[1]))], // nov 3
    [/\b(?:on (?:the )?|the )(\d{1,2})(?:st|nd|rd|th)\b/, m => dayOnly(Number(m[1]))], // on the 3rd ("2nd hand" alone isn't a date)
  ];
  for (const [re, toDays] of RULES){
    const m = t.match(re), days = m ? toDays(m) : null;
    if (days !== null) return {days, at: m.index, len: m[0].length};
  }
  return null;
}

function parseLine(raw, today = todayKey()){
  // 1. Clean the line: lowercase; "₹500", "Rs500", "rs. 500", "500rs" and "500/-" all end up as "rs 500"-style;
  //    "1,500" -> "1500", "2k" -> "2 k"; punctuation goes but letters of any script stay ("café", "चाय").
  let t = ' ' + String(raw).toLowerCase().replace(/₹/g, ' rs ').replace(/(\d),(?=\d)/g, '$1')
    .replace(/\b(rs|inr)(?=\d)/g, '$1 ').replace(/(\d)(rs|inr|rupees?|k|l)\b/g, '$1 $2')
    .replace(/\brs\b\.?/g, ' rs ').replace(/,/g, ' , ').replace(/\.(?!\d)/g, ' ')
    .replace(/[^\p{L}\p{M}0-9.&,'\/ -]/gu, ' ').replace(/\s+/g, ' ').replace(/(\d) ?\/-/g, '$1 ').trim() + ' ';
  // Hinglish: "rahul ko" = to Rahul, "rahul se" = from Rahul, "rahul ne" = Rahul (did)
  t = t.replace(/ (\p{L}[\p{L}\p{M}'-]*) ko(?= )/gu, ' to $1').replace(/ (\p{L}[\p{L}\p{M}'-]*) se(?= )/gu, ' from $1').replace(/ (\p{L}[\p{L}\p{M}'-]*) ne(?= )/gu, ' $1')
       .replace(/\b(?:maine|mene)\b/g, 'i').replace(/\bmujhe\b/g, 'me').replace(/\bke liye\b/g, 'for');
  t = ' ' + t.replace(/\s+/g, ' ').trim() + ' ';

  // 2. Number words to digits: "two thousand five hundred" -> "2500", "1.5 k" -> "1500".
  t = numberize(t);

  // 3. Speech fillers go: "um", "uh", "hmm", "basically", "actually" anywhere; "so", "ok", "okay", "like" at the
  //    start; "like" before a number or "I"/"we" ("spent like 200"). Whole words only: "likes", "Uber", "kiwi" stay.
  t = t.replace(/ (?:u+m+|u+h+|h+m+|basically|actually)(?= )/g, '').replace(/^(?: (?:so|ok|okay|like))+(?= )/, '')
       .replace(/ like(?= (?:\d|i |we ))/g, '');

  const r = {type: 'spent', amount: 0, person: '', with: [], desc: '', cat: '', mode: '', day: 0, card: ''};
  const cut = re => { t = (' ' + t.replace(re, ' ') + ' ').replace(/\s+/g, ' '); };
  const cats = [...new Set([...S.everything.map(e => e.cat).filter(Boolean), ...(getSettings().privateCats || []), ...DEFAULT_CATS])];
  // Cards you've named, as they appear in the cleaned line (only names made of letters, digits, spaces, & ' -), longest first.
  const cards = cardNames().filter(c => /^[\p{L}\p{M}0-9&' -]+$/u.test(c));
  const cardAlt = cards.map(c => c.toLowerCase().trim().replace(/\s+/g, ' ')).sort((a, b) => b.length - a.length).join('|');
  const knownCard = w => cards.find(c => c.toLowerCase().trim().replace(/\s+/g, ' ') === w) || '';

  // 4. The day, before the amount: "on 3 nov" has a number that isn't the amount.
  const date = readDate(t, today);
  if (date){ r.day = date.days; t = t.slice(0, date.at) + ' ' + t.slice(date.at + date.len); }
  cut(/\btoday\b/);
  cut(/\//g); // slashes that weren't part of a date

  // 5. Amount (the first number), payment mode, currency words.
  const gotMoney = /\b(?:got|get|getting) (?:paid\b|\d)/.test(t); // "got 15000 for the gig": money came in
  let m = t.match(/ (\d+(?:\.\d+)?) /);
  if (m){ r.amount = parseFloat(m[1]); t = t.replace(m[0], ' '); }

  //    A credit card bill ("paid hdfc card bill", "credit card bill 12000", "paid sbi bill" for a card you've named) isn't
  //    spending. Found before the payment mode, which would otherwise take "card" as how it was paid.
  const namedBill = cardAlt && new RegExp('\\b(?:my )?(' + cardAlt + ') (?:credit )?(?:card )?(?:ka )?bill\\b');
  const bm = (namedBill && t.match(namedBill)) || t.match(CARD_BILL);
  if (bm){
    r.type = 'cardbill';
    const w = bm[1] || '', isName = w && !FILLER.has(w) && !NAME_STOP.has(w) && !NOT_CARD_NAME.has(w);
    if (isName) r.card = knownCard(w) || titleCase(w);
    const from = isName || !w ? bm.index : bm.index + w.length + 1; // a word that isn't the card's name stays in the line
    t = t.slice(0, from) + ' ' + t.slice(bm.index + bm[0].length);
  }
  // A card you've named, right before "card", says which card paid: "shoes 2499 on hdfc card".
  const namedCard = cardAlt && new RegExp('\\b(?:by |via |using |with |through |on )?(?:my )?(' + cardAlt + ') (?:credit |debit )?card\\b');
  for (const [re, mo] of [[/\b(?:by |via |through |using |with |in |on )?(?:upi|gpay|g pay|google pay|phonepe|phone pe|paytm|bhim)\b/, 'UPI'],
                          [/\b(?:by |via |using |with |in )?cash\b/, 'Cash'],
                          [/\b(?:by |via |using |with |through |on )?(?:credit |debit )?card\b/, 'Card']]){
    if (!re.test(t)) continue;
    if (mo === 'Card' && r.type === 'cardbill') break; // a card bill is paid to the card, never with it
    const named = mo === 'Card' && namedCard && t.match(namedCard);
    if (named){ r.card = knownCard(named[1]); cut(namedCard); } else cut(re);
    r.mode = mo; break;
  }
  cut(/\b(?:rs|rupees?|rupay|inr|bucks)\b/g);

  // 6. Type and person. `who` is a name heard after a word ("to rahul") or at the start ("rahul returned").
  const after = w => { const mm = t.match(new RegExp('\\b(?:' + w + ') ' + NM, 'u')); return mm ? {name: mm[1], at: mm.index + mm[0].length - mm[1].length} : null; };
  const subj = verbs => { const mm = t.match(new RegExp('^ ' + NM + ' (?:' + verbs + ')\\b', 'u')); return mm && !NAME_STOP.has(mm[1].split(' ')[0]) ? {name: mm[1], at: 1} : null; };
  const firstWord = h => h ? h.name.split(' ')[0] : '';
  // a shop, a category word or a category name ("from flipkart", "from freelance") rather than someone
  const isPlace = h => { const w = firstWord(h); return !matchPerson(w) && [w, h.name].some(n => SHOPS.has(n) || CAT_WORD_SET.has(n) || cats.some(c => c.toLowerCase() === n)); };
  const canBePerson = h => !!h && !NAME_STOP.has(firstWord(h)) && !isPlace(h);
  let who;
  if (r.type === 'cardbill'){ /* already decided above */ }
  else if (/\b(?:got|get|received|recieved|took|taken|getting) (?:my money )?back\b|\bwapas (?:mile|aaye|liye|liya|mil gaye)\b/.test(t)){ r.type = 'gotback'; who = after('from'); }
  else if ((who = subj('returned|repaid|paid me back|paid back|gave me back|gave back|has returned|has paid|wapas diye|wapas diya|wapas kiye|wapas kar diye|lauta diye|lauta diya'))){ r.type = 'gotback'; }
  else if (/\b(?:paid|gave|given|returned|repaid|pay) back\b|\b(?:returned|repaid)\b|\b(?:wapas|lauta) (?:diye|diya|kiye|kar diye|de diye)\b/.test(t)){ r.type = 'paidback'; who = after('to') || after('repaid|returned|paid back|gave back|given back|pay back'); } // "repaid rahul 5000"
  else if ((who = subj('gave me|lent me|loaned me|lend me|me diye|me diya|me de diye'))){ r.type = 'borrowed'; }
  else if (/\b(?:borrowed|borrow|borrowing|udhaar liya|udhar liya|udhaar li|udhar li)\b/.test(t) || (/\b(?:took|taken|liye|liya|le liye)\b/.test(t) && /\bfrom\b/.test(t))){ r.type = 'borrowed'; who = after('from'); }
  else if (/\b(?:lent|lend|lended|lented|lending|loaned|udhaar diya|udhar diya|udhaar di|udhar di)\b/.test(t) || (/\b(?:diye|diya|de diye)\b/.test(t) && /\bto\b/.test(t))){ r.type = 'lent'; who = after('to') || after('lent|lend|lended|lented|loaned'); }
  else if (/\bgave\b/.test(t) && (canBePerson(after('to')) || matchPerson(firstWord(after('gave'))))){ r.type = 'lent'; who = after('to') || after('gave'); } // "gave 2000 to the plumber" is a spend
  else if (/\b(?:received|recieved|credited|salary|income|earned|refund|cashback|stipend)\b/.test(t) || gotMoney || (/\bgot\b/.test(t) && canBePerson(after('from')))){ r.type = 'received'; who = after('from'); } // "got shoes from amazon" is a spend

  // A new name is still a person for a loan; for money in, a shop stays in the description ("refund from flipkart").
  if (who && !NAME_STOP.has(firstWord(who)) && !(TYPES[r.type].kind === 'flow' && isPlace(who))){
    const used = who.name.includes(' ') && matchPerson(who.name) ? who.name : firstWord(who); // two words only for someone you know ("neha gupta")
    r.person = matchPerson(used) || titleCase(used);
    t = t.slice(0, who.at) + ' ' + t.slice(who.at + used.length);
  }

  // 7. A spend's "with Rahul, Priya and Neha" (or "with rahul with priya"): the names up to the first word that isn't one.
  if (r.type === 'spent'){
    const toks = t.trim().split(' '), names = [];
    for (let i = toks.indexOf('with'); i >= 0; i = toks.indexOf('with', i)){
      const found = []; let j = i + 1;
      for (; j < toks.length; j++){
        const w = toks[j], two = w + ' ' + (toks[j + 1] || '');
        if (w === ',' || w === 'and' || w === '&' || w === 'with') continue;
        if (toks[j + 1] && isKnown(two)){ found.push(two); j++; continue; } // "neha gupta" is one person
        if (NAME_STOP.has(w) || /\d/.test(w) || (!isKnown(w) && (CAT_WORD_SET.has(w) || GROUP_WORDS.has(w) || SHOPS.has(w)))) break;
        found.push(w);
      }
      if (found.length){ names.push(...found); toks.splice(i, j - i); } else i++;
    }
    if (names.length){ r.with = [...new Set(names.map(n => matchPerson(n) || titleCase(n)))]; t = ' ' + toks.join(' ') + ' '; }
  }

  // 8. "spent 50 on parking and 20 on toll" is one entry for the total (70), described as "Parking and toll".
  if (TYPES[r.type].kind === 'flow' && !r.person)
    t = t.replace(/ and (\d+(?:\.\d+)?)(?= )/g, (_, n) => { r.amount = Math.round((r.amount + parseFloat(n)) * 100) / 100; return ' and'; });
  if (r.amount > MAX_AMOUNT) r.amount = 0;

  // 9. What's left, minus filler words, is the description.
  const words = t.replace(/[,&]/g, ' ').split(' ').filter(w => w && !FILLER.has(w) && /[\p{L}0-9]/u.test(w)); // a lone "-" or "'" isn't a word
  while (words[0] === 'and') words.shift();
  while (words[words.length - 1] === 'and') words.pop();
  let desc = words.join(' ');
  if (r.type === 'received' && !desc && /salary/.test(raw.toLowerCase())) desc = 'salary';
  const tpl = desc && templates(S.everything).find(x => x.key === desc.toLowerCase());
  r.desc = tpl ? tpl.desc : (desc ? desc.charAt(0).toUpperCase() + desc.slice(1) : '');

  // 10. Category: from a past entry with the same description, a category name in it, or a known word ("uber" -> Transport).
  if (TYPES[r.type].kind === 'flow' && r.desc){
    if (tpl && tpl.cat && tpl.type === r.type) r.cat = tpl.cat;
    const dl = ' ' + r.desc.toLowerCase() + ' ', dw = dl.trim().split(' ');
    if (!r.cat) r.cat = cats.find(c => dw.includes(c.toLowerCase())) || '';
    if (!r.cat && r.type === 'spent') for (const [c, list] of Object.entries(CAT_WORDS)) if (list.some(w => dl.includes(' ' + w + ' '))){ r.cat = c; break; }
    if (!r.cat && r.type === 'received' && /\b(?:salary|stipend)\b/.test(dl)) r.cat = 'Salary';
  }
  return r;
}

function applyParsed(r, heard){
  D.type = r.type; D.typeTouched = true;
  if (r.amount) D.amountStr = trimAmt(r.amount);
  D.desc = r.desc; $('#f-desc').value = r.desc;
  if (r.type === 'spent'){ D.with = r.with.slice(); D.person = ''; $('#f-person').value = ''; }
  else { D.person = r.person; $('#f-person').value = r.person; }
  if (r.cat){ D.cat = r.cat; D.catTouched = true; }
  if (r.mode) D.mode = r.mode;
  if (r.card) D.card = r.card;
  if (r.type === 'cardbill' && D.mode === 'Card') D.mode = 'UPI';
  D.date = addDays(todayKey(), -r.day);
  $('#desc-sugg').innerHTML = '';
  syncSheet(); syncAmount(true); buzz(); setPad(!r.amount);
  const notes = [];
  if (!r.amount) notes.push('tap in the amount');
  if (TYPES[r.type].kind === 'debt' && !r.person) notes.push('add who it was with');
  if (r.type === 'cardbill' && !D.card) notes.push('pick which card');
  if (!S.unlocked && r.cat && isPrivate({cat: r.cat, type: r.type})) notes.push('this goes to a private category');
  const h = $('#heard'); h.hidden = false;
  h.innerHTML = `Heard <b>“${esc(heard)}”</b>${notes.length ? ' · ' + esc(notes.join(' · ')) : '. Check it and tap Save.'}`;
}
function runLine(v){ stopVoice(); v = (v || '').trim(); if (!v || !D) return; applyParsed(parseLine(v), v); $('#f-say').value = ''; $('#f-say').blur(); }

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
function micUI(){
  const b = $('#mic-btn'), i = $('#f-say');
  b.classList.toggle('on', listening);
  b.setAttribute('aria-label', listening ? 'Stop listening' : 'Speak an entry');
  i.placeholder = listening ? 'Listening… say it like “chai 20”' : 'lent 200 to Ashish · chai 20 cash';
  if (listening) $('#sh-body').scrollTop = 0; // what you say shows in the first box of the form
}
function stopVoice(){ if (rec && listening){ try { rec.abort(); } catch {} } listening = false; if ($('#mic-btn')) micUI(); }
function startVoice(){
  if (apkVersion() >= 3){ openNative('from=app', 'voice'); return; }
  if (!SpeechRec){ $('#f-say').focus(); toast("Voice isn't available in this browser. Type it in the box instead."); return; }
  if (listening){ try { rec.stop(); } catch {} return; }
  rec = new SpeechRec(); rec.lang = 'en-IN'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  let finalText = '', failed = false;
  rec.onresult = ev => {
    let txt = '';
    for (let i = 0; i < ev.results.length; i++){ txt += ev.results[i][0].transcript; if (ev.results[i].isFinal) finalText = txt; }
    $('#f-say').value = txt;
  };
  rec.onerror = ev => {
    failed = true;
    const e = ev.error;
    if (e === 'not-allowed' || e === 'service-not-allowed') toast('Allow the microphone for this site in your browser settings, then try again.');
    else if (e === 'no-speech') toast("Didn't catch that. Tap the mic and try again.");
    else if (e === 'network') toast('Voice needs internet. Type it in the box instead.');
    else if (e !== 'aborted') toast("Voice didn't work this time. Type it in the box instead.");
  };
  rec.onend = () => {
    const was = listening; listening = false; micUI();
    const v = (finalText || $('#f-say').value).trim();
    if (was && v && !failed) runLine(v); else if (was && v) runLine(v);
  };
  try { rec.start(); listening = true; micUI(); buzz(); }
  catch { listening = false; micUI(); $('#f-say').focus(); }
}

(() => {
  const fab = $('.fab'); let t = null;
  const clear = () => { clearTimeout(t); t = null; };
  fab.addEventListener('pointerdown', () => { clear(); t = setTimeout(() => { t = null; fab.dataset.lp = '1'; openEntry({}); startVoice(); }, 450); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => fab.addEventListener(ev, clear));
  fab.addEventListener('contextmenu', e => e.preventDefault());
})();

function oldLoanIssues(){
  const out = [];
  for (const p of peopleIndex().values()){
    if (!p.bal) continue;
    const n = lc(p.name);
    const sumT = t => S.everything.filter(e => e.type === t && lc(e.person) === n).reduce((s, e) => s + e.amount - (e.prior || 0), 0);
    if (p.bal > 0){ const x = Math.min(p.bal, Math.max(0, sumT('paidback') - sumT('borrowed'))); if (x > 0) out.push({name: p.name, type: 'paidback', extra: x}); }
    else { const x = Math.min(-p.bal, Math.max(0, sumT('gotback') - sumT('lent'))); if (x > 0) out.push({name: p.name, type: 'gotback', extra: x}); }
  }
  return out;
}
function oldLoanCard(){
  const list = oldLoanIssues(); if (!list.length) return '';
  return `<div class="ask" style="margin-top:14px"><p><b>Check ${list.length === 1 ? 'this balance' : 'these balances'}.</b> A repayment here has no matching loan in Ledger. If the loan was from before you started using Ledger, tap Fix so it doesn't count.</p>
    ${list.map(i => `<div class="sugg-row"><span>${esc(i.name)} · ${i.type === 'paidback' ? `you paid back ${rupee(i.extra)}` : `returned ${rupee(i.extra)} to you`}</span><button class="btn primary" data-act="fixprior" data-t="${i.type}" data-n="${esc(i.name)}">Fix</button></div>`).join('')}</div>`;
}
/* person page: "Rahul paid their share" settles every open share of theirs in one tap */
async function markSharesPaid(name){
  const n = lc(name), now = Date.now(), before = [], recs = [];
  let total = 0;
  for (const e of S.everything){
    if (e.type !== 'spent' || !withOf(e).some(x => lc(x) === n)) continue;
    const sh = Math.round(shareOf(e) * 100) / 100, got = repaidOf(e, n);
    if (sh - got <= 0.5) continue;
    before.push(cleanRec(e));
    recs.push({...cleanRec(e), with: withOf(e).slice(), paidBack: {...(e.paidBack || {}), [n]: sh}, updatedAt: now, _dirty: 1});
    total += sh - got;
  }
  if (!recs.length) return;
  await commit(recs);
  toast(`${name} paid back ${rupee(total)}`, 'Undo', () => store.putMany(before.map(r => ({...r, updatedAt: Date.now()}))));
}
async function fixOldLoan(name, type){
  const n = lc(name), p = peopleIndex().get(n); if (!p) return;
  const sumT = t => S.everything.filter(e => e.type === t && lc(e.person) === n).reduce((s, e) => s + e.amount - (e.prior || 0), 0);
  let left = type === 'paidback' ? Math.min(p.bal, sumT('paidback') - sumT('borrowed')) : Math.min(-p.bal, sumT('gotback') - sumT('lent'));
  if (!(left > 0)) return;
  const now = Date.now(), recs = [];
  for (const e of S.everything.filter(e => e.type === type && lc(e.person) === n).sort(byRecent)){
    if (left <= 0) break;
    const room = e.amount - (e.prior || 0); if (room <= 0) continue;
    const take = Math.min(room, left); left -= take;
    recs.push({...cleanRec(e), prior: Math.round(((e.prior || 0) + take) * 100) / 100, updatedAt: now, _dirty: 1});
  }
  if (recs.length) await commit(recs);
  const q = peopleIndex().get(n);
  toast(q && q.bal ? `Fixed. ${q.bal > 0 ? `${q.name} owes you ${rupee(q.bal)}` : `You owe ${q.name} ${rupee(q.bal)}`}` : `Fixed. You and ${name} are settled`);
}

async function boot(){
  S.loading = true; render();
  S.unlocked = lsGet('ledger-hidden') !== '1';
  try { await IDB.open(); } catch { DB = LSDB; }
  try { (await DB.all()).forEach(r => { if (r && typeof r.id === 'string') S.all.set(r.id, r); }); } catch {}
  refreshEntries(); S.loading = false; render();
  Sync.init();
  try { if (sessionStorage.getItem('ledger-updated')){ sessionStorage.removeItem('ledger-updated'); setTimeout(() => toast('Ledger updated to the latest version'), 600); } } catch {}
  const qp = new URLSearchParams(location.search);
  if (qp.get('src') === 'apk'){ try { sessionStorage.setItem('ledger-apk', qp.get('apkv') || '1'); } catch {} }
  if ([...qp.keys()].length){ try { history.replaceState(null, '', location.pathname); } catch {} }
  const inbox = qp.get('inbox');
  if (inbox){
    try {
      const b64 = inbox.replace(/-/g, '+').replace(/_/g, '/'), pad = '='.repeat((4 - b64.length % 4) % 4);
      const json = new TextDecoder().decode(Uint8Array.from(atob(b64 + pad), ch => ch.charCodeAt(0)));
      const list = JSON.parse(json).filter(e => e && typeof e.id === 'string' && (e.deleted || validEntry(e)));
      if (list.length){ await store.putMany(list); const n = list.filter(e => !e.deleted).length; if (n) toast(`Added ${n} from Quick add`); }
    } catch {}
  }
  if (qp.has('quick')) openQuick();
  else if (qp.has('say')){ openEntry({}); runLine(qp.get('say')); }
  else if (qp.has('add') || qp.has('voice')){ openEntry({}); if (qp.has('voice')) startVoice(); }
  else if (!apkVersion() && lsGet(QUICK_START) === '1' && !qp.has('app')) openQuick();
  checkAppUpdate();
}
boot();
})();

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => {
  const hadController = !!navigator.serviceWorker.controller;
  let reg = null, reloading = false;
  navigator.serviceWorker.register('./sw.js', {updateViaCache: 'none'}).then(r => { reg = r; r.update().catch(() => {}); }).catch(() => {});
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && reg) reg.update().catch(() => {}); });
  const apply = () => {
    if (reloading) return;
    if (window.__ledgerBusy && window.__ledgerBusy()){ setTimeout(apply, 3000); return; }  // don't interrupt an entry in progress
    reloading = true; try { sessionStorage.setItem('ledger-updated', '1'); } catch {} location.reload();
  };
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) apply(); });
});
</script>
