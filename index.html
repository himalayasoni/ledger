<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ledger</title>
<meta name="description" content="Your personal money diary: expenses, lending and shared bills.">
<meta name="theme-color" content="#ECF1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column. A deep-teal ledger card opens Home, entries are grouped by day,
   a bottom tab bar carries a raised marigold add key, and adding happens in a bottom sheet with a numpad. */
:root{
  --bg:#ECF1EE; --surface:#FFFFFF; --surface-2:#E1E8E4; --ink:#12201B; --ink-2:#55665F; --line:#D2DCD7;
  --accent:#F0A20F; --accent-ink:#2A1B00; --accent-soft:#FBE7BD;
  --deep:#0E3A33; --deep-2:#175046; --deep-ink:#EAF4F0; --deep-ink-2:#A6C6BC;
  --spent:#BF3F29; --in:#1B8455; --lend:#2C66AD;
  --scrim:rgba(10,24,20,.45); --shadow:0 12px 32px -14px rgba(14,58,51,.45);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1412; --surface:#151F1C; --surface-2:#1E2A26; --ink:#E6EFEB; --ink-2:#97A9A2; --line:#283632;
  --accent:#F5B43A; --accent-ink:#231700; --accent-soft:#3A2D10;
  --deep:#113F37; --deep-2:#1A5248; --deep-ink:#E8F4EF; --deep-ink-2:#9CC2B7;
  --spent:#F0806A; --in:#4CC48D; --lend:#72A6EA;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1412; --surface:#151F1C; --surface-2:#1E2A26; --ink:#E6EFEB; --ink-2:#97A9A2; --line:#283632;
  --accent:#F5B43A; --accent-ink:#231700; --accent-soft:#3A2D10;
  --deep:#113F37; --deep-2:#1A5248; --deep-ink:#E8F4EF; --deep-ink-2:#9CC2B7;
  --spent:#F0806A; --in:#4CC48D; --lend:#72A6EA;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{color-scheme:light}
img{max-width:100%}
button{-webkit-tap-highlight-color:transparent}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);text-align:left;margin-top:1px}
.sd{width:8px;height:8px;border-radius:50%;background:var(--ink-2);flex:0 0 auto}
.sd.ok{background:var(--in)} .sd.warn{background:var(--spent)} .sd.busy{background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.install{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.install b{display:block;font-family:var(--f-display);font-size:16px}
.install span{display:block;font-size:13px;color:var(--ink-2)}
body{margin:0;min-height:100vh;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-block:14px 120px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:inline-grid;place-items:center;font-style:normal;color:var(--accent-ink);font-size:14px}
.top small{display:block;color:var(--ink-2);font-size:13px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);background:var(--surface);border:1px solid var(--line)}
.icon-btn svg{width:20px;height:20px}
.hbtns{display:flex;gap:8px}
.say{display:flex;gap:8px;align-items:center;margin-top:10px}
.say .inp{height:44px;font-size:15px}
.mic{flex:0 0 44px;height:44px;border-radius:12px;background:var(--deep);color:var(--accent);display:grid;place-items:center}
.mic svg{width:20px;height:20px}
.mic.on{background:var(--spent);color:var(--bg);animation:pulse 1s ease-in-out infinite}
.heard{font-size:13px;color:var(--ink-2);margin-top:6px}
.heard b{color:var(--ink)}
.ubar{display:flex;align-items:center;gap:8px;width:100%;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px;text-align:left}
.ubar svg{width:16px;height:16px;flex:0 0 auto}
.ubar b{margin-left:auto;text-decoration:underline;text-underline-offset:3px}
.fab{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.icon-btn.unlocked{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.tag.priv{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--ink)}
.pin{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));overflow-y:auto}
.pin-card{width:100%;max-width:360px;display:grid;gap:14px;text-align:center}
.pin-ic{width:56px;height:56px;border-radius:18px;background:var(--deep);color:var(--accent);display:grid;place-items:center;margin:0 auto}
.pin-ic svg{width:26px;height:26px}
.pin-card h2{margin:0;font-family:var(--f-display);font-size:24px;text-wrap:balance}
.pin-card .sub{margin:0;color:var(--ink-2);min-height:21px}
.pin-card .sub.bad{color:var(--spent);font-weight:600}
.pin-dots{display:flex;justify-content:center;gap:14px;min-height:18px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-2)}
.pin-dots i.on{background:var(--ink);border-color:var(--ink)}
.pin .pad{border-top:0}
.pin-foot{display:flex;justify-content:space-between;gap:12px}
.code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:26px;font-weight:700;letter-spacing:.08em;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:16px;user-select:all}
.priv-list{display:flex;flex-wrap:wrap;gap:8px}
.chip.pv.on{background:var(--deep);border-color:var(--deep);color:var(--deep-ink)}
.sugg-box{background:var(--accent-soft);border-radius:12px;padding:12px;display:grid;gap:8px;text-align:left}
.sugg-box b{font-family:var(--f-display)}
.sugg-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
h1.page{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em;margin:0;text-wrap:balance}

/* hero */
.hero{background:var(--deep);color:var(--deep-ink);border-radius:22px;padding:20px 20px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;
  background:repeating-radial-gradient(circle, transparent 0 10px, rgba(255,255,255,.05) 10px 11px)}
.hero .lbl{font-size:13px;color:var(--deep-ink-2);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1.05;letter-spacing:-.03em;margin-top:4px}
.hero .cmp{font-size:14px;color:var(--deep-ink-2);margin-top:6px}
.hero .cmp b{color:var(--deep-ink);font-weight:600}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.mini{background:var(--deep-2);border-radius:12px;padding:10px 10px 9px;min-width:0}
.mini span{display:block;font-size:12px;color:var(--deep-ink-2)}
.mini b{display:block;font-family:var(--f-display);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* streak */
.streak{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.streak .s-txt b{font-family:var(--f-display);font-size:17px;display:block}
.streak .s-txt span{font-size:13px;color:var(--ink-2)}
.dots{display:flex;gap:6px}
.dot{display:grid;justify-items:center;gap:3px;font-size:10px;color:var(--ink-2);font-weight:600}
.dot i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.dot.on i{background:var(--accent);border-color:var(--accent)}
.dot.today i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent-soft)}

/* sections & list */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 8px;gap:12px}
.sec-h h2{font-family:var(--f-display);font-size:18px;margin:0;font-weight:700}
.sec-h a,.link{color:var(--ink-2);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.day{margin-top:14px}
.day-h{display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:0 4px 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.row.flash{animation:flash 1.2s ease}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.ic{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px;
  color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.ic svg{width:18px;height:18px}
.mid{flex:1;min-width:0}
.mid .t{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .m{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .n{display:block;font-size:13px;color:var(--ink-2);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);margin-left:6px;vertical-align:2px;font-style:normal}
.amt{text-align:right;font-family:var(--f-display);font-weight:700;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.amt small{display:block;font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.amt.in{color:var(--in)} .amt.lend{color:var(--lend)}

/* empty */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:22px;padding:28px 22px;text-align:center}
.empty h2{font-family:var(--f-display);font-size:24px;margin:8px 0 6px;text-wrap:balance}
.empty p{color:var(--ink-2);margin:0 auto 18px;max-width:36ch}
.empty .art{width:72px;height:72px;margin:0 auto;border-radius:22px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:36px;transform:rotate(-6deg)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{height:44px;padding:0 18px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;gap:8px;background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:color-mix(in srgb,var(--spent) 14%,transparent);color:var(--spent)}
.btn.wide{width:100%;justify-content:center}
.muted{color:var(--ink-2)}

/* people */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.tile span{font-size:13px;color:var(--ink-2);display:block}
.tile b{font-family:var(--f-display);font-size:24px;font-weight:800;display:block;margin-top:2px}
.tile small{color:var(--ink-2);font-size:12px}
.av{flex:0 0 38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--f-display);background:var(--surface-2);color:var(--ink)}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.owe-you{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)}
.pill.you-owe{background:color-mix(in srgb,var(--spent) 15%,transparent);color:var(--spent)}
.pill.even{background:var(--surface-2);color:var(--ink-2)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:600;padding:6px 0 12px}
.person-hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}
.person-hero .nm{font-family:var(--f-display);font-size:30px;font-weight:800;letter-spacing:-.02em}
.person-hero .bal{font-size:16px;margin-top:4px}
.person-hero .bal b{font-family:var(--f-display);font-size:22px}
.person-hero .btns{justify-content:flex-start;margin-top:16px}

/* search */
.searchbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-top:14px}
.searchbar svg{width:18px;height:18px;color:var(--ink-2);flex:0 0 auto}
.searchbar input{border:0;background:none;outline:none;height:48px;flex:1;min-width:0;font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;margin-inline:-2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:0 0 auto}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .sw{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.on .sw{background:var(--c)}
.frow{margin-top:10px}
.more{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.more summary{padding:12px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"+";font-family:var(--f-display);font-size:18px;line-height:1}
.more[open] summary::after{content:"–"}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}
.fgrid .full{grid-column:1/-1}
.fld{display:grid;gap:4px;min-width:0}
.fld > span{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}
.inp{height:44px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:0 12px;width:100%;min-width:0;font-size:16px}
textarea.inp{height:auto;padding:10px 12px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.resbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between;margin:16px 4px 8px}
.resbar b{font-family:var(--f-display);font-size:18px}
.resbar span{font-size:13px;color:var(--ink-2)}
.resbar .clr{font-size:13px;font-weight:700;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}

/* insights */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
.mnav b{font-family:var(--f-display);font-size:17px}
.mnav button{width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.mnav button:disabled{opacity:.3;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.card h3{margin:0 0 12px;font-family:var(--f-display);font-size:16px;font-weight:700}
.bars{display:grid;gap:12px}
.bar-row{display:grid;gap:5px;width:100%}
.bar-top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.bar-top span:first-child{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.bar-top span:last-child{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:170px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.col .v{font-size:11px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.col .b{width:100%;max-width:38px;border-radius:8px 8px 3px 3px;background:var(--surface-2);min-height:3px}
.col.cur .b{background:var(--accent)}
.col .x{font-size:12px;font-weight:700;color:var(--ink-2)}
.col.cur .x{color:var(--ink)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0;padding-top:0}
.kv b{font-variant-numeric:tabular-nums}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:6px max(16px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink-2);padding:6px 0;border-radius:12px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--accent)}
.fab{justify-self:center;width:62px;height:62px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:0 10px 22px -8px color-mix(in srgb,var(--accent) 70%,transparent);transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:28px;height:28px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;transition:opacity .22s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;margin:0 auto;max-width:560px;max-height:94dvh;max-height:94vh;display:flex;flex-direction:column;
  background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px -10px rgba(0,0,0,.3);
  padding:8px max(16px, env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.25,1)}
@supports (max-height:94dvh){.sheet{max-height:94dvh}}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 6px}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-head h2{margin:0;font-family:var(--f-display);font-size:18px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 0 2px}
.tbtn{border:1px solid var(--line);border-radius:12px;padding:7px 10px;text-align:left;background:var(--surface);min-width:0;transition:background .15s}
.tbtn b{display:block;font-size:14px;line-height:1.2}
.tbtn span{display:block;font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tbtn.on span{color:var(--bg);opacity:.7}
.chip.wp{background:var(--accent-soft);border-color:transparent}
.chip.wp span{font-size:17px;line-height:1;color:var(--ink-2)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.qa button{display:grid;justify-items:center;align-content:start;gap:6px;padding:12px 4px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font-size:13px;font-weight:700;line-height:1.2;text-align:center;min-width:0}
.qa i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);font-style:normal}
.qa svg{width:18px;height:18px}
.person-hero .sub{font-size:14px;color:var(--ink-2);margin-top:8px}
.person-hero .sub b{color:var(--ink);font-family:var(--f-display);font-size:18px}
.amount{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:10px 0 8px;font-family:var(--f-display);font-weight:800;cursor:text;user-select:none}
.amount .cur{font-size:28px;color:var(--ink-2)}
.amount #amt-val{font-size:52px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.amount.zero #amt-val{color:var(--ink-2);opacity:.45}
.amount.bump #amt-val{animation:bump .14s ease}
@keyframes bump{50%{transform:scale(1.05)}}
.shake{animation:shake .35s ease}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.sh-body{flex:1;overflow-y:auto;display:grid;gap:14px;align-content:start;padding:4px 2px 12px;min-height:80px}
.quick-h{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.qp{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.qp b{font-variant-numeric:tabular-nums}
.sugg{display:grid;gap:4px;margin-top:6px}
.sugg button{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;background:var(--surface-2);text-align:left;font-size:14px}
.sugg button span{color:var(--ink-2);white-space:nowrap}
.hint{font-size:13px;color:var(--ink-2);margin-top:6px}
.hint b{color:var(--ink)}
.err{font-size:13px;color:var(--spent);font-weight:600;margin-top:4px}
.date-inp{height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-weight:600;font-size:14px}
.date-inp.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-top:6px;border-top:1px solid var(--line)}
.pad button{height:48px;border-radius:12px;background:var(--surface-2);font-family:var(--f-display);font-size:22px;font-weight:700;display:grid;place-items:center}
.pad button:active{background:var(--line)}
.pad svg{width:22px;height:22px}
.save{margin-top:8px;height:54px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:17px;width:100%;flex:0 0 auto}
.save:active{transform:scale(.99)}
@media (pointer:coarse){ .sheet.typing .pad{display:none} }
.done{position:absolute;inset:0;border-radius:24px 24px 0 0;background:var(--surface);display:grid;place-items:center;z-index:2}
.done .ring{width:96px;height:96px;border-radius:50%;background:var(--accent);display:grid;place-items:center;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}

.done p{font-family:var(--f-display);font-weight:800;font-size:22px;margin:14px 0 0;text-align:center}
.done-in{display:grid;justify-items:center}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.sheet .del{color:var(--spent);font-weight:700;justify-self:start;padding:6px 0}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:60;
  background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px 12px 16px;display:flex;gap:14px;align-items:center;
  width:max-content;max-width:calc(100vw - 32px);font-weight:600;font-size:14px;transition:opacity .2s,transform .2s;pointer-events:none}

pre.export{max-height:180px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;white-space:pre-wrap;word-break:break-all}

@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} .done path{stroke-dashoffset:0} }
@media (max-width:380px){ .hero .big{font-size:38px} .mini b{font-size:15px} .amount #amt-val{font-size:44px} }

<script>
(() => {
'use strict';
/* ---------- constants ---------- */
const TYPES = {
  spent:    {label:'Spent',     cap:'Money out',       sign:-1, kind:'flow', person:'Spent with',    bal:0},
  received: {label:'Received',  cap:'Money in',        sign: 1, kind:'flow', person:'Received from', bal:0},
  lent:     {label:'Lent',      cap:'They owe you',    sign:-1, kind:'debt', person:'Lent to',       bal: 1},
  borrowed: {label:'Borrowed',  cap:'You owe them',    sign: 1, kind:'debt', person:'Borrowed from', bal:-1},
  gotback:  {label:'Got back',  cap:'They repaid you', sign: 1, kind:'debt', person:'Got back from', bal:-1},
  paidback: {label:'Paid back', cap:'You repaid them', sign:-1, kind:'debt', person:'Paid back to',  bal: 1},
};
const DEFAULT_CATS = ['Food','Groceries','Transport','Bills','Shopping','Rent','Health','Fun','Travel','Gifts','Other'];
const CAT_COLORS = {Food:'#E0862A',Groceries:'#4F9A3A',Transport:'#3B7DC4',Bills:'#8A5CC2',Shopping:'#D0517E',Rent:'#A0702E',
  Health:'#D1453B',Fun:'#B84FC4',Travel:'#1E9AA0',Gifts:'#E2683C',Other:'#7A8A84',Salary:'#1B8455',Freelance:'#2E8F6E'};
const PALETTE = ['#E0862A','#3B7DC4','#4F9A3A','#8A5CC2','#D0517E','#1E9AA0','#A0702E','#D1453B','#B84FC4'];
const MODES = ['UPI','Cash','Card','Other'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const LS_MODE = 'ledger-mode';
const ICON = {
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>',
  unlock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 7.6-1.7"/></svg>',
  group:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .7 3.2 2.4 3.6 5.2"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>',
  in:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17M15 17H7V9"/></svg>',
  back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>',
  del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12zM17 9l-6 6M11 9l6 6"/></svg>',
};

/* ---------- state ---------- */
const S = {
  entries: [], everything: [], all: new Map(), unlocked: false, hiddenCount: 0, view:'home', person:null, mode:'local', loading:false,
  f: freshFilters(),
  im: null,            // insights month {y,m}
  flashId: null,
};
function freshFilters(){ return {q:'', types:[], range:'all', from:'', to:'', person:'', cat:'', mode:'', min:'', max:'', note:false, sort:'date-desc'}; }

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('en-IN', {maximumFractionDigits:2});
const rupee = n => '₹' + nf.format(Math.abs(Math.round(n*100)/100));
const pad2 = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const todayKey = () => keyOf(new Date());
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const fmtDate = k => { const d = parseKey(k); return `${pad2(d.getDate())} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const dayLabel = k => {
  const t = todayKey();
  if (k === t) return 'Today';
  if (k === addDays(t,-1)) return 'Yesterday';
  const d = parseKey(k), cur = new Date().getFullYear();
  return `${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}${d.getFullYear()!==cur ? ' '+d.getFullYear() : ''}`;
};
const short = n => {
  n = Math.abs(n);
  if (n >= 1e7) return '₹' + (n/1e7).toFixed(1).replace(/\.0$/,'') + 'Cr';
  if (n >= 1e5) return '₹' + (n/1e5).toFixed(1).replace(/\.0$/,'') + 'L';
  if (n >= 1e3) return '₹' + (n/1e3).toFixed(1).replace(/\.0$/,'') + 'k';
  return '₹' + Math.round(n);
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const hashColor = s => { let h=0; for (const c of s) h = (h*31 + c.charCodeAt(0))|0; return PALETTE[Math.abs(h)%PALETTE.length]; };
const catColor = c => CAT_COLORS[c] || hashColor(c || 'x');
const initial = s => (s||'?').trim().charAt(0).toUpperCase() || '?';
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch {} };
const buzz = () => { try { navigator.vibrate && navigator.vibrate(12); } catch {} };
const byRecent = (a,b) => (b.date.localeCompare(a.date)) || ((b.createdAt||0)-(a.createdAt||0));

/* ---------- derived data ---------- */
/* people on a shared expense: e.with (new) or the old single person on a spent entry */
function withOf(e){ return (e.with && e.with.length) ? e.with : (e.type === 'spent' && e.person ? [e.person] : []); }
function shareOf(e){ const w = withOf(e); return e.amount / Math.max(1, w.length + (e.incMe === false ? 0 : 1)); }
function involves(e, name){ const n = name.toLowerCase(); return (e.type !== 'spent' && (e.person||'').toLowerCase() === n) || withOf(e).some(x => x.toLowerCase() === n); }
function peopleIndex(){
  const m = new Map();
  const get = (name, date) => {
    const k = name.toLowerCase(); let p = m.get(k);
    if (!p){ p = {name, bal:0, count:0, last:'', debt:false, treat:0, treats:0}; m.set(k,p); }
    p.count++; if (date > p.last){ p.last = date; p.name = name; }
    return p;
  };
  for (const e of S.entries){
    const t = TYPES[e.type];
    if (e.person && e.type !== 'spent'){
      const p = get(e.person, e.date);
      if (t.kind === 'debt'){ p.debt = true; p.bal += t.bal * e.amount; }
    }
    const w = withOf(e);
    if (w.length){ const sh = shareOf(e); for (const n of w){ const p = get(n, e.date); p.treat += sh; p.treats++; } }
  }
  for (const p of m.values()){ p.bal = Math.round(p.bal*100)/100; p.treat = Math.round(p.treat*100)/100; }
  return m;
}
function allPeople(){ return [...peopleIndex().values()].sort((a,b)=>b.last.localeCompare(a.last)).map(p=>p.name); }
function canonPerson(n){
  n = (n||'').trim().replace(/\s+/g,' ');
  if (!n) return '';
  return allPeople().find(p => p.toLowerCase() === n.toLowerCase()) || n;
}
function templates(src = S.entries){
  const m = new Map();
  const sorted = [...src].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  for (const e of sorted){
    if (!e.desc) continue;
    const k = e.desc.trim().toLowerCase();
    let t = m.get(k);
    if (!t){ t = {key:k, desc:e.desc.trim(), amount:e.amount, cat:e.cat, type:e.type, person:e.person, with:withOf(e), incMe:e.incMe!==false, mode:e.mode, count:0, last:e.createdAt||0}; m.set(k,t); }
    t.count++;
  }
  return [...m.values()];
}
function catOrder(){
  const cnt = {};
  for (const e of S.entries) if (e.cat) cnt[e.cat] = (cnt[e.cat]||0) + 1;
  const used = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  const ps = S.unlocked ? new Set() : privateSet();
  const extra = (getSettings().privateCats || []).filter(c => !cnt[c] && !DEFAULT_CATS.includes(c));
  return [...used, ...extra, ...DEFAULT_CATS.filter(c => !cnt[c])].filter(c => !ps.has(c.toLowerCase()));
}
function monthSum(y, m, type, uptoDay){

  let s = 0;
  for (const e of S.entries) if (e.type === type && e.date.startsWith(pre) && (!uptoDay || Number(e.date.slice(8)) <= uptoDay)) s += e.amount;
  return s;
}
function loggedDays(){ const s = new Set(); for (const e of S.everything) if (e.createdAt) s.add(keyOf(new Date(e.createdAt))); return s; }
function streak(){
  const days = loggedDays(); let k = todayKey(), n = 0;
  if (!days.has(k)) k = addDays(k,-1);
  while (days.has(k)){ n++; k = addDays(k,-1); }
  return n;
}

/* ---------- storage: this device first (IndexedDB), Google sync on top ---------- */
function validEntry(e){ return e && typeof e === 'object' && typeof e.id === 'string' && TYPES[e.type] && typeof e.amount === 'number' && /^\d{4}-\d{2}-\d{2}$/.test(e.date||''); }
function cleanRec(r){ const c = {...r}; delete c._dirty; return c; }
const CFG_ID = 'cfg-private';
function getSettings(){ const r = S.all.get(CFG_ID); return (r && !r.deleted) ? r : {}; }
function saveSettings(patch){ return store.put({...getSettings(), ...patch, id: CFG_ID}); }
function privacyOn(){ return !!getSettings().pinHash; }
function privateSet(){ return new Set(privacyOn() ? (getSettings().privateCats || []).map(c => c.toLowerCase()) : []); }
function isPrivate(e, ps = privateSet()){ return !!e.cat && TYPES[e.type].kind !== 'debt' && ps.has(e.cat.toLowerCase()); }
function refreshEntries(){
  S.everything = [...S.all.values()].filter(r => !r.deleted && validEntry(r));
  const ps = privateSet(); S.hiddenCount = 0;
  S.entries = (S.unlocked || !ps.size) ? S.everything : S.everything.filter(e => { const h = isPrivate(e, ps); if (h) S.hiddenCount++; return !h; });
}

const IDB = {
  db: null,
  open(){ return new Promise((res, rej) => {
    let r; try { r = indexedDB.open('ledger', 1); } catch (e) { rej(e); return; }
    r.onupgradeneeded = () => { const d = r.result;
      if (!d.objectStoreNames.contains('entries')) d.createObjectStore('entries', {keyPath:'id'});
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta'); };
    r.onsuccess = () => { this.db = r.result; res(); };
    r.onerror = () => rej(r.error);
  }); },
  tx(name, mode, fn){ return new Promise((res, rej) => {
    const t = this.db.transaction(name, mode), req = fn(t.objectStore(name)); let out;
    if (req) req.onsuccess = () => { out = req.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }); },
  all(){ return this.tx('entries', 'readonly', os => os.getAll()); },
  putMany(list){ return this.tx('entries', 'readwrite', os => { list.forEach(r => os.put(r)); }); },
  getMeta(k){ return this.tx('meta', 'readonly', os => os.get(k)); },
  setMeta(k, v){ return this.tx('meta', 'readwrite', os => { os.put(v, k); }); },
};
/* fallback when IndexedDB is unavailable (some private windows) */
const LSDB = {
  all(){ try { return Promise.resolve(JSON.parse(lsGet('ledger-entries') || '[]')); } catch { return Promise.resolve([]); } },
  putMany(){ lsSet('ledger-entries', JSON.stringify([...S.all.values()])); return Promise.resolve(); },
  getMeta(k){ try { return Promise.resolve(JSON.parse(lsGet('ledger-meta-' + k))); } catch { return Promise.resolve(undefined); } },
  setMeta(k, v){ lsSet('ledger-meta-' + k, JSON.stringify(v)); return Promise.resolve(); },
};
let DB = IDB, persistAsked = false;

async function commit(recs){
  for (const r of recs) S.all.set(r.id, r);
  refreshEntries(); render();
  try { await DB.putMany(recs); } catch { toast("Couldn't save on this device. Export a backup to be safe."); }
  if (!persistAsked){ persistAsked = true; try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {} }
  Sync.schedule();
}
const store = {
  put(e){ return commit([{...cleanRec(e), updatedAt: Date.now(), _dirty: 1}]); },
  putMany(list){
    const now = Date.now();
    const fresh = list.filter(e => { const cur = S.all.get(e.id); return !cur || (e.updatedAt || 0) > (cur.updatedAt || 0); });
    return commit(fresh.map(e => ({...cleanRec(e), updatedAt: e.updatedAt || now, _dirty: 1})));
  },
  remove(id){ return this.removeMany([id]); },
  removeMany(ids){ const now = Date.now(); return commit(ids.map(id => ({id, deleted: true, updatedAt: now, _dirty: 1}))); },
};

/* ---------- Google sync (Firebase Auth + Firestore) ---------- */
const FB_V = '10.12.2';
function ago(t){ const s = (Date.now() - t) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s/60) + ' min ago'; if (s < 86400) return Math.floor(s/3600) + ' h ago'; return fmtDate(keyOf(new Date(t))); }
function syncError(code){
  const c = String(code || '');
  if (c.includes('permission-denied')) return "This Google account isn't allowed by your Firebase rules. Sign out and sign in with the account named in the rules.";
  if (c.includes('unauthorized-domain')) return "This web address isn't in Firebase's authorized domains yet.";
  if (c.includes('popup')) return 'The sign-in window was blocked or closed. Try again.';
  if (c.includes('network')) return "Couldn't reach Google. Check your connection.";
  if (c === 'load') return "Couldn't load the sync code. Your entries are safe on this device.";
  return 'Sync hit a problem' + (c ? ' (' + c + ')' : '') + '. Your entries are safe on this device.';
}
function syncInfo(){
  const s = Sync.state;
  if (s === 'off') return {cls:'', txt:'Saved on this device'};
  if (s === 'loading') return {cls:'busy', txt:'Connecting…'};
  if (s === 'signedout') return {cls:'warn', txt:'Not backed up · sign in'};
  if (s === 'syncing') return {cls:'busy', txt:'Syncing…'};
  if (s === 'offline') return {cls:'', txt:'Offline · saved on device'};
  if (s === 'error') return {cls:'warn', txt:'Sync problem'};
  return {cls:'ok', txt:'Synced ' + (Sync.lastSync ? ago(Sync.lastSync) : '')};
}
const Sync = {
  state:'off', user:null, fb:null, err:'', lastSync:0, lastSrv:0, unsub:null, pushing:false, timer:null, starting:false, col:null,
  cfg(){ const c = window.LEDGER_FIREBASE; return c && c.apiKey ? c : null; },
  async init(){
    const cfg = this.cfg();
    if (!cfg){ this.state = 'off'; ui(); return; }
    if (this.fb || this.starting) return;
    this.starting = true; this.state = 'loading'; ui();
    try {
      const base = `https://www.gstatic.com/firebasejs/${FB_V}/`;
      const [app, A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
      const a = app.initializeApp(cfg);
      this.fb = {A, F, auth: A.getAuth(a), db: F.getFirestore(a)};
      this.lastSync = (await DB.getMeta('lastSync')) || 0;
      A.getRedirectResult(this.fb.auth).catch(e => toast(syncError(e.code)));
      A.onAuthStateChanged(this.fb.auth, u => {
        this.user = u;
        if (u) this.start(); else { this.stop(); this.state = 'signedout'; ui(); }
      });
    } catch (e) { this.state = navigator.onLine ? 'error' : 'offline'; this.err = 'load'; ui(); }
    this.starting = false;
  },
  async start(){
    const {F, db} = this.fb, uid = this.user.uid;
    this.col = F.collection(db, 'users', uid, 'entries');
    const prev = await DB.getMeta('uid');
    if (prev !== uid){
      // first sign-in on this device (or a different account): send everything on the device up
      await DB.setMeta('uid', uid); await DB.setMeta('lastSrv', 0);
      const all = [...S.all.values()].map(r => ({...r, _dirty: 1}));
      all.forEach(r => S.all.set(r.id, r));
      if (all.length) await DB.putMany(all);
    }
    this.lastSrv = (await DB.getMeta('lastSrv')) || 0;
    this.err = ''; this.state = navigator.onLine ? 'syncing' : 'offline'; ui();
    this.listen(); this.push();
  },
  stop(){ if (this.unsub){ this.unsub(); this.unsub = null; } },
  listen(){
    const {F} = this.fb; this.stop();
    const q = F.query(this.col, F.where('srv', '>', F.Timestamp.fromMillis(this.lastSrv)));
    this.unsub = F.onSnapshot(q, snap => this.pull(snap), e => { this.unsub = null; this.state = 'error'; this.err = e.code || 'listen'; ui(); });
  },
  async pull(snap){
    const take = []; let max = this.lastSrv;
    for (const ch of snap.docChanges()){
      if (ch.type === 'removed' || ch.doc.metadata.hasPendingWrites) continue;
      const r = {...ch.doc.data()};
      const srv = r.srv && r.srv.toMillis ? r.srv.toMillis() : 0; delete r.srv;
      if (srv > max) max = srv;
      if (!r.id) r.id = ch.doc.id;
      const loc = S.all.get(r.id);
      if (!loc || (r.updatedAt || 0) > (loc.updatedAt || 0)) take.push(r);
    }
    if (take.length){ take.forEach(r => S.all.set(r.id, r)); refreshEntries(); try { await DB.putMany(take); } catch {} }
    if (max > this.lastSrv){ this.lastSrv = max; DB.setMeta('lastSrv', max); }
    if (!snap.metadata.fromCache){
      this.lastSync = Date.now(); DB.setMeta('lastSync', this.lastSync);
      if (!this.pushing && this.state !== 'error') this.state = 'ok';
    }
    ui();
  },
  schedule(){ if (!this.user) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 1200); },
  async push(){
    if (!this.user || !this.fb || this.pushing) return;
    const dirty = [...S.all.values()].filter(r => r._dirty);
    if (!dirty.length) return;
    if (!navigator.onLine){ this.state = 'offline'; ui(); return; }
    this.pushing = true; this.state = 'syncing'; ui();
    const {F, db} = this.fb;
    try {
      for (let i = 0; i < dirty.length; i += 400){
        const chunk = dirty.slice(i, i + 400), b = F.writeBatch(db);
        for (const r of chunk){ const c = JSON.parse(JSON.stringify(cleanRec(r))); c.srv = F.serverTimestamp(); b.set(F.doc(this.col, r.id), c); }
        await b.commit();
        const done = [];
        for (const r of chunk){ const cur = S.all.get(r.id); if (cur && cur._dirty && cur.updatedAt === r.updatedAt){ const c = cleanRec(cur); S.all.set(c.id, c); done.push(c); } }
        if (done.length) await DB.putMany(done);
      }
      this.state = 'ok'; this.err = ''; this.lastSync = Date.now(); DB.setMeta('lastSync', this.lastSync);
    } catch (e) { this.state = navigator.onLine ? 'error' : 'offline'; this.err = e.code || 'push'; }
    this.pushing = false; ui();
    if (this.state === 'ok' && [...S.all.values()].some(r => r._dirty)) this.schedule();
  },
  syncNow(){ if (!this.user) return; this.state = 'syncing'; ui(); this.listen(); this.push(); },
  async signIn(){
    if (!this.fb){ await this.init(); if (!this.fb){ toast("Can't reach Google right now."); return; } }
    const {A, auth} = this.fb, p = new A.GoogleAuthProvider();
    p.setCustomParameters({prompt: 'select_account'});
    try { await A.signInWithPopup(auth, p); toast('Signed in. Syncing your entries.'); }
    catch (e) {
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment'){
        try { await A.signInWithRedirect(auth, p); } catch (e2) { toast(syncError(e2.code)); }
      } else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') toast(syncError(e.code));
    }
  },
  async signOut(){ if (!this.fb) return; this.stop(); await this.fb.A.signOut(this.fb.auth); toast('Signed out. Your entries stay on this device.'); },
};
function ui(){ render(); if (typeof openEl !== 'undefined' && openEl && openEl.id === 'panel') renderPanel(); }

function rowHtml(e, opts={}){
  const t = TYPES[e.type];

  const color = isDebt ? 'var(--lend)' : (e.type==='received' ? 'var(--in)' : catColor(e.cat));
  const icon = isDebt ? (t.sign < 0 ? ICON.out : ICON.in) : esc(initial(e.cat || e.desc));
  const title = e.desc || (isDebt ? (e.person ? `${t.person} ${e.person}` : t.label) : (e.cat || t.label));
  const meta = [];
  const w = withOf(e);
  if (w.length) meta.push('with ' + esc(w.slice(0,2).join(', ')) + (w.length > 2 ? ` +${w.length-2}` : ''));
  else if (e.person && !(isDebt && !e.desc)) meta.push(esc(e.person));
  const theirs = (opts.who && w.some(x => x.toLowerCase() === opts.who)) ? rupee(shareOf(e)) + ' theirs' : '';
  if (e.cat && !isDebt) meta.push(esc(e.cat));
  if (e.mode) meta.push(esc(e.mode));
  if (opts.showDate) meta.push(esc(fmtDate(e.date)));
  const cls = e.type==='received' ? 'in' : (isDebt ? 'lend' : '');

  return `<button class="row${S.flashId===e.id?' flash':''}" data-act="open" data-id="${esc(e.id)}">
    <span class="ic" style="--c:${color}">${icon}</span>
    <span class="mid"><span class="t">${esc(title)}${S.unlocked && isPrivate(e) ? '<span class="tag priv">Private</span>' : ''}${e.sample?'<span class="tag">Example</span>':''}</span>
      ${meta.length?`<span class="m">${meta.join(' · ')}</span>`:''}
      ${e.note?`<span class="n">“${esc(e.note)}”</span>`:''}</span>
    <span class="amt ${cls}">${sign}${rupee(e.amount)}${theirs ? `<small>${theirs}</small>` : (isDebt||e.type==='received'?`<small>${t.label}</small>`:'')}</span>
  </button>`;
}
function groupedList(list, opts={}){
  const groups = new Map();
  for (const e of list){ if (!groups.has(e.date)) groups.set(e.date, []); groups.get(e.date).push(e); }
  let h = '';
  for (const [k, items] of groups){
    const spent = items.filter(e=>e.type==='spent').reduce((s,e)=>s+e.amount,0);
    h += `<div class="day"><div class="day-h"><span>${esc(dayLabel(k))}</span><span class="num">${spent?'Spent '+rupee(spent):''}</span></div>
      <div class="list">${items.map(e=>rowHtml(e,opts)).join('')}</div></div>`;
  }
  return h;
}

function filtered(){
  const f = S.f, t = todayKey();

  if (f.range==='month'){ from = t.slice(0,8)+'01'; to = t; }
  if (f.range==='lastmonth'){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); from = keyOf(d); const e = new Date(d.getFullYear(), d.getMonth()+1, 0); to = keyOf(e); }
  if (f.range==='custom'){ from = f.from; to = f.to; }
  const q = f.q.trim().toLowerCase();
  const min = parseFloat(f.min), max = parseFloat(f.max);
  let r = S.entries.filter(e => {
    if (f.types.length && !f.types.includes(e.type)) return false;
    if (from && e.date < from) return false;
    if (to && e.date > to) return false;
    if (f.person && !involves(e, f.person)) return false;
    if (f.cat && e.cat !== f.cat) return false;
    if (f.mode && e.mode !== f.mode) return false;
    if (!isNaN(min) && e.amount < min) return false;
    if (!isNaN(max) && e.amount > max) return false;
    if (f.note && !e.note) return false;
    if (q){
      const hay = [e.desc,e.person,withOf(e).join(' '),e.cat,e.note,e.mode,TYPES[e.type].label,String(e.amount),fmtDate(e.date)].join(' ').toLowerCase();
      if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  });
  const s = f.sort;
  r.sort(s==='date-asc' ? (a,b)=>-byRecent(a,b) : s==='amt-desc' ? (a,b)=>b.amount-a.amount : s==='amt-asc' ? (a,b)=>a.amount-b.amount
    : s==='name' ? (a,b)=>(a.desc||a.person||'').localeCompare(b.desc||b.person||'') : byRecent);
  return r;
}

  }
  const prev = D.editId ? S.entries.find(x=>x.id===D.editId) : null;
  const firstToday = !prev && !loggedDays().has(todayKey());
  const e = {
    id: D.editId || uid(), type: D.type, amount, desc: $('#f-desc').value.trim(), person,
    cat: t.kind==='debt' ? '' : (D.cat || (D.type==='spent' ? 'Other' : '')), mode: D.mode, date: D.date || todayKey(),
    note: $('#f-note').value.trim(), createdAt: prev?.createdAt || Date.now(), updatedAt: Date.now(),
  };

  if (multi && D.with.length){ e.with = [...D.with]; e.incMe = !!D.incMe; }
  saving = true;
  try { await store.put(e); }
  catch { saving = false; toast("Couldn't save. Check your connection and try again."); return; }
  saving = false;
  lsSet(LS_MODE, D.mode);
  S.flashId = e.id; buzz();
  const st = streak();
  $('#done-txt').textContent = prev ? 'Updated' : (firstToday && st > 1 ? `${st}-day streak` : 'Logged');
  $('#done').hidden = false;
  render();
  setTimeout(() => {
    closeSheet();
    toast(!S.unlocked && isPrivate(e) ? 'Saved privately' : prev ? 'Entry updated' : `Logged ${rupee(amount)}${e.desc ? ' · '+e.desc : ''}${e.with ? ' · with ' + e.with.length + (e.with.length===1 ? ' person' : ' people') : ''}`);
  }, 650);
}

function toCSV(){
  const head = ['Date','Type','Amount','Description','Person','Category','Paid with','Comment','Spent with','My share included'];
  const q = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  return [head.join(','), ...[...S.entries].sort(byRecent).map(e => [e.date, TYPES[e.type].label, e.amount, e.desc, e.type==='spent' ? '' : e.person, e.cat, e.mode, e.note, withOf(e).join('; '), withOf(e).length ? (e.incMe===false ? 'No' : 'Yes') : ''].map(q).join(','))].join('\n');
}
function doExport(fmt){
  const data = fmt==='csv' ? toCSV() : JSON.stringify({app:'ledger', version:1, exported:new Date().toISOString(), entries:S.entries.map(cleanRec)}, null, 1);
  const filename = `ledger-${todayKey()}.${fmt}`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type: fmt==='csv' ? 'text/csv' : 'application/json'}));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast(`Saved ${filename}`);
}
async function doImport(file){

    const list = (Array.isArray(parsed) ? parsed : parsed.entries || []).filter(validEntry);
    if (!list.length){ toast('No entries found in that file.'); return; }
    closeSheet(); toast(`Importing ${list.length} entries…`);

}

let confirmOff = false, privTouched = false;
const PRIVATE_WORDS = ['sutta','cigarette','cigarettes','cig','cigs','smoke','smoking','gold flake','marlboro','classic milds','hookah','vape','beer','beers','daru','alcohol','liquor','whisky','whiskey','vodka','rum','wine','pub','bar','theka','bira','kingfisher','budweiser','weed','ganja','gutka','gutkha','tobacco','pan masala','betting','casino','poker','rummy','dream11','lottery'];
const wordRe = new RegExp('\\b(' + PRIVATE_WORDS.map(w => w.replace(/ /g, '\\s+')).join('|') + ')\\b', 'i');
const title1 = w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
function privacySuggestions(){
  const ps = privateSet(), cats = new Map(), moves = new Map();
  for (const e of S.everything){
    if (TYPES[e.type].kind === 'debt' || isPrivate(e, ps)) continue;
    if (e.cat && wordRe.test(e.cat)){ cats.set(e.cat, (cats.get(e.cat) || 0) + 1); continue; }
    const m = (e.desc || '').match(wordRe);
    if (m){ const w = title1(m[1].replace(/\s+/g, ' ')); const g = moves.get(w) || {word: w, ids: []}; g.ids.push(e.id); moves.set(w, g); }
  }
  return {cats: [...cats.entries()].map(([c, n]) => ({c, n})), moves: [...moves.values()]};
}
async function privacyMove(word){
  const g = privacySuggestions().moves.find(x => x.word === word); if (!g) return;
  const now = Date.now();
  await commit(g.ids.map(id => ({...cleanRec(S.all.get(id)), cat: word, updatedAt: now, _dirty: 1})));

const Pin = {mode: null, stage: 0, buf: '', first: '', code: '', msg: '', bad: false, fails: 0, until: 0, resolve: null};

  const pad = (ok) => `<div class="pad">${['1','2','3','4','5','6','7','8','9', ok ? 'ok' : '', '0','del'].map(k => k ? `<button data-act="pinkey" data-k="${k}" aria-label="${k === 'del' ? 'Delete digit' : k === 'ok' ? 'Done' : k}">${k === 'del' ? ICON.del : k === 'ok' ? '✓' : k}</button>` : '<span></span>').join('')}</div>`;
  if (m === 'unlock'){

      + `<div class="pin-foot"><button class="link" data-act="pincancel">Cancel</button><span></span></div>`;
  } else if (m === 'code'){

      + `<div class="code">${esc(Pin.code)}</div><button class="btn primary wide" data-act="pincodeok">I've saved it</button>`;
  } else if (m === 'recover'){

      + `<input class="inp" id="rec-in" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX" style="text-align:center;font-size:20px;letter-spacing:.08em">`
      + `<button class="btn primary wide" data-act="pinrecover">Reset PIN</button>`

  } else if (m === 'reset'){

function pinFail(msg){ Pin.msg = msg; Pin.bad = true; Pin.buf = ''; pinRender(); const d = $('#pin-dots'); d && shake(d); buzz(); }
async function pinKey(k){

  if (Date.now() < Pin.until){ pinFail('Too many tries. Wait a few seconds.'); return; }
  if (k === 'del'){ Pin.buf = Pin.buf.slice(0, -1); pinRender(); return; }
  if (k === 'ok'){ if (Pin.mode === 'setup') await pinSetupNext(); return; }
  if (Pin.buf.length >= 6) return;
  Pin.buf += k; Pin.msg = ''; pinRender();
  if (Pin.mode === 'unlock' && Pin.buf.length === (getSettings().pinLen || 4)){
    const s = getSettings();
    if (await slowHash(Pin.buf, s.salt) === s.pinHash){ Pin.fails = 0; pinDone(true); }
    else { Pin.fails++; if (Pin.fails >= 5){ Pin.fails = 0; Pin.until = Date.now() + 30000; pinFail('Too many tries. Wait 30 seconds.'); } else pinFail('Wrong PIN. Try again.'); }

async function pinSetupNext(){
  if (Pin.buf.length < 4){ pinFail('Use at least 4 digits'); return; }
  if (!Pin.first){ Pin.first = Pin.buf; Pin.buf = ''; Pin.msg = ''; pinRender(); return; }
  if (Pin.buf !== Pin.first){ Pin.first = ''; pinFail("Those didn't match. Choose your PIN again."); return; }
  const salt = randHex(16), recSalt = randHex(16), code = newRecoveryCode();
  const [pinHash, recHash] = await Promise.all([slowHash(Pin.buf, salt), slowHash(normCode(code), recSalt)]);
  await saveSettings({pinHash, salt, pinLen: Pin.buf.length, recHash, recSalt, privateCats: getSettings().privateCats || []});
  Pin.mode = 'code'; Pin.code = code; Pin.buf = ''; Pin.first = ''; pinRender();
}
async function pinRecover(){
  const s = getSettings(), v = normCode($('#rec-in') && $('#rec-in').value);

  if (s.recHash && await slowHash(v, s.recSalt) === s.recHash){ Object.assign(Pin, {mode: 'setup', buf: '', first: '', msg: 'Code accepted. Choose a new PIN.'}); pinRender(); }

}
async function pinWipe(){
  const ids = S.everything.filter(e => isPrivate(e)).map(e => e.id);
  if (ids.length) await store.removeMany(ids);
  await saveSettings({pinHash: null, salt: null, pinLen: null, recHash: null, recSalt: null, privateCats: []});

}

  const d = Array.from({length: a.length + 1}, (_, i) => [i]);

  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));

function numberize(t){
  const toks = t.trim().split(' '), out = [];
  let total = 0, cur = 0, any = false, lastDigit = false;
  const flush = () => { if (any) out.push(String(Math.round((total + cur) * 100) / 100)); total = 0; cur = 0; any = false; lastDigit = false; };
  for (let i = 0; i < toks.length; i++){
    const w = toks[i], nx = toks[i + 1] || '';
    if (/^\d+(\.\d+)?$/.test(w)){ if (any && lastDigit) flush(); cur += parseFloat(w); any = true; lastDigit = true; continue; }
    if (w in SMALLN){ cur += SMALLN[w]; any = true; lastDigit = false; continue; }
    if (w === 'a' && (nx === 'hundred' || nx === 'thousand' || nx === 'lakh')){ cur += 1; any = true; continue; }
    if ((w in MULTN) && any){ if (w === 'hundred') cur *= 100; else { total += cur * MULTN[w]; cur = 0; } lastDigit = false; continue; }
    if (w === 'and' && any && ((nx in SMALLN) || /^\d/.test(nx))) continue;
    flush(); out.push(w);
  }

}
function parseLine(raw){
  let t = ' ' + String(raw).toLowerCase().replace(/₹/g, ' rs ').replace(/(\d),(?=\d)/g, '$1').replace(/(\d)(rs|k|l)\b/g, '$1 $2')

  else if (/\byesterday\b/.test(t)){ r.day = 1; cut(/\byesterday\b/); }

  else if (/\b(?:borrowed|borrow|borrowing|udhaar liya|udhar liya|udhaar li|udhar li)\b/.test(t) || (/\b(?:took|taken|liye|liya|le liye)\b/.test(t) && /\bfrom\b/.test(t))){ r.type = 'borrowed'; r.person = after('from'); }
  else if (/\b(?:lent|lend|lended|lented|lending|loaned|udhaar diya|udhar diya|udhaar di|udhar di)\b/.test(t) || (/\b(?:diye|diya|de diye)\b/.test(t) && /\bto\b/.test(t))){ r.type = 'lent'; r.person = after('to') || after('(?:lent|lend|lended|lented|loaned)'); }

  if (r.mode) D.mode = r.mode;
  D.date = addDays(todayKey(), -r.day);
  $('#desc-sugg').innerHTML = '';
  syncSheet(); syncAmount(true); buzz();
  const notes = [];
  if (!r.amount) notes.push('tap in the amount');
  if (TYPES[r.type].kind === 'debt' && !r.person) notes.push('add who it was with');
  if (!S.unlocked && r.cat && isPrivate({cat: r.cat, type: r.type})) notes.push('this goes to a private category');
  const h = $('#heard'); h.hidden = false;
  h.innerHTML = `Heard <b>“${esc(heard)}”</b>${notes.length ? ' · ' + esc(notes.join(' · ')) : '. Check it and tap Save.'}`;
}
function runLine(v){ stopVoice(); v = (v || '').trim(); if (!v || !D) return; applyParsed(parseLine(v), v); $('#f-say').value = ''; $('#f-say').blur(); }

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
function micUI(){
  const b = $('#mic-btn'), i = $('#f-say');
  b.classList.toggle('on', listening);
  b.setAttribute('aria-label', listening ? 'Stop listening' : 'Speak an entry');
  i.placeholder = listening ? 'Listening… say it like “chai 20”' : 'Say or type: lent 200 to Ashish';
}
function stopVoice(){ if (rec && listening){ try { rec.abort(); } catch {} } listening = false; if ($('#mic-btn')) micUI(); }
function startVoice(){
  if (!SpeechRec){ $('#f-say').focus(); toast("Voice isn't available in this browser. Type it in the box instead."); return; }
  if (listening){ try { rec.stop(); } catch {} return; }
  rec = new SpeechRec(); rec.lang = 'en-IN'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  let finalText = '', failed = false;
  rec.onresult = ev => {
    let txt = '';
    for (let i = 0; i < ev.results.length; i++){ txt += ev.results[i][0].transcript; if (ev.results[i].isFinal) finalText = txt; }
    $('#f-say').value = txt;
  };
  rec.onerror = ev => {
    failed = true;
    const e = ev.error;
    if (e === 'not-allowed' || e === 'service-not-allowed') toast('Allow the microphone for this site in your browser settings, then try again.');
    else if (e === 'no-speech') toast("Didn't catch that. Tap the mic and try again.");
    else if (e === 'network') toast('Voice needs internet. Type it in the box instead.');
    else if (e !== 'aborted') toast("Voice didn't work this time. Type it in the box instead.");
  };
  rec.onend = () => {
    const was = listening; listening = false; micUI();
    const v = (finalText || $('#f-say').value).trim();
    if (was && v && !failed) runLine(v); else if (was && v) runLine(v);
  };
  try { rec.start(); listening = true; micUI(); buzz(); }
  catch { listening = false; micUI(); $('#f-say').focus(); }
}
$('#f-say').addEventListener('focus', () => { if (listening) stopVoice(); });
$('#f-say').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); runLine(e.target.value); } });
// long-press the + button to speak straight away
(() => {
  const fab = $('.fab'); let t = null;
  const clear = () => { clearTimeout(t); t = null; };
  fab.addEventListener('pointerdown', () => { clear(); t = setTimeout(() => { t = null; fab.dataset.lp = '1'; openEntry({}); startVoice(); }, 450); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => fab.addEventListener(ev, clear));
  fab.addEventListener('contextmenu', e => e.preventDefault());
})();

async function boot(){
  S.loading = true; render();
  try { await IDB.open(); } catch { DB = LSDB; }
  try { (await DB.all()).forEach(r => { if (r && typeof r.id === 'string') S.all.set(r.id, r); }); } catch {}
  refreshEntries(); S.loading = false; render();
  Sync.init();
  const qp = new URLSearchParams(location.search);
  if (qp.has('add') || qp.has('voice')){
    try { history.replaceState(null, '', location.pathname); } catch {}
    openEntry({});
    if (qp.has('voice')) startVoice();
  }
}
boot();
})();
</script>

if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
