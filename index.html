<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Ledger</title>
<meta name="description" content="Your personal money diary: expenses, lending and shared bills.">
<meta name="theme-color" content="#ECF1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column. A deep-teal ledger card opens Home, entries are grouped by day,
   a bottom tab bar carries a raised marigold add key, and adding happens in a bottom sheet with a numpad. */
:root{
  --bg:#ECF1EE; --surface:#FFFFFF; --surface-2:#E1E8E4; --ink:#12201B; --ink-2:#55665F; --line:#D2DCD7;
  --accent:#F0A20F; --accent-ink:#2A1B00; --accent-soft:#FBE7BD;
  --deep:#0E3A33; --deep-2:#175046; --deep-ink:#EAF4F0; --deep-ink-2:#A6C6BC;
  --spent:#BF3F29; --in:#1B8455; --lend:#2C66AD;
  --scrim:rgba(10,24,20,.45); --c-cur:#1E7563; --shadow:0 12px 32px -14px rgba(14,58,51,.45);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1412; --surface:#151F1C; --surface-2:#1E2A26; --ink:#E6EFEB; --ink-2:#97A9A2; --line:#283632;
  --accent:#F5B43A; --accent-ink:#231700; --accent-soft:#3A2D10;
  --deep:#113F37; --deep-2:#1A5248; --deep-ink:#E8F4EF; --deep-ink-2:#9CC2B7;
  --spent:#F0806A; --in:#4CC48D; --lend:#72A6EA;
  --scrim:rgba(0,0,0,.6); --c-cur:#5FC4AA; --shadow:0 12px 32px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1412; --surface:#151F1C; --surface-2:#1E2A26; --ink:#E6EFEB; --ink-2:#97A9A2; --line:#283632;
  --accent:#F5B43A; --accent-ink:#231700; --accent-soft:#3A2D10;
  --deep:#113F37; --deep-2:#1A5248; --deep-ink:#E8F4EF; --deep-ink-2:#9CC2B7;
  --spent:#F0806A; --in:#4CC48D; --lend:#72A6EA;
  --scrim:rgba(0,0,0,.6); --c-cur:#5FC4AA; --shadow:0 12px 32px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{color-scheme:light}
img{max-width:100%}
button{-webkit-tap-highlight-color:transparent}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);text-align:left;margin-top:1px}
.sd{width:8px;height:8px;border-radius:50%;background:var(--ink-2);flex:0 0 auto}
.sd.ok{background:var(--in)} .sd.warn{background:var(--spent)} .sd.busy{background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.install{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.install b{display:block;font-family:var(--f-display);font-size:16px}
.install span{display:block;font-size:13px;color:var(--ink-2)}
body{margin:0;min-height:100vh;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-block:14px 120px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:inline-grid;place-items:center;font-style:normal;color:var(--accent-ink);font-size:14px}
.top small{display:block;color:var(--ink-2);font-size:13px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);background:var(--surface);border:1px solid var(--line)}
.icon-btn svg{width:20px;height:20px}
.hbtns{display:flex;gap:8px}
.trend .tp{fill:var(--ink-2);opacity:.35}
.trend .tb.on .tv{stroke:var(--ink);stroke-width:1.5}
.trend .tb.on .xl{fill:var(--ink);font-weight:700}
/* quick add popup */
.qscrim{position:fixed;inset:0;z-index:70;background:var(--scrim)}
.quick{position:fixed;z-index:75;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px, calc(100vw - 24px));max-height:calc(100vh - 24px);overflow-y:auto;
  background:var(--surface);border-radius:24px;box-shadow:0 24px 60px -18px rgba(0,0,0,.45);padding:16px;display:grid;gap:12px;animation:qin .18s ease-out}
@keyframes qin{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}}
.qk-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qk-head h2{margin:0;font-family:var(--f-display);font-size:17px;display:flex;align-items:center;gap:6px}
.qk-head h2 svg{width:18px;height:18px;color:var(--accent)}
.qk-amt{display:flex;align-items:baseline;justify-content:center;gap:4px;font-family:var(--f-display);font-weight:800}
.qk-amt .cur{font-size:26px;color:var(--ink-2)}
.qk-amt #qk-val{font-size:48px;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.qk-amt.zero #qk-val{color:var(--ink-2);opacity:.45}
.qk-amt.bump #qk-val{animation:bump .14s ease}
.qk-cats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.qk-cats button{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 6px;min-width:0}
.qk-cats button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qk-cats button i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:0 0 auto}
.qk-cats button:active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qk-hint{text-align:center;font-size:12px;color:var(--ink-2);margin:-4px 0 0}
.quick .pad{border-top:0;padding-top:0}
.quick .pad button{height:46px}
.qk-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qk-foot .link{font-size:13px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
.switch input{width:22px;height:22px;accent-color:var(--accent);flex:0 0 auto}
.ask{background:var(--accent-soft);border-radius:12px;padding:12px;display:grid;gap:10px;margin-top:8px}
.ask p{margin:0;font-size:14px;color:var(--ink)}
/* add sheet keypad: digits on the left; delete, hide and a tall Save key on the right (like a calculator's = key) */
.kpad{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:46px;gap:6px;padding-top:6px;flex:0 0 auto}
.kpad button{border-radius:12px;background:var(--surface-2);font-family:var(--f-display);font-size:22px;font-weight:700;display:grid;place-items:center;min-width:0}
.kpad button:active{background:var(--line)}
.kpad svg{width:22px;height:22px}
.kpad .k-save{grid-column:4;grid-row:3 / span 2;background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:800}
.kpad .k-save:active{background:color-mix(in srgb,var(--accent) 85%,var(--ink))}
.sheet.padoff .kpad{display:none}
/* with the keypad down: a small "123" key to bring it back, and the full Save button */
.sh-foot{display:none;gap:8px;padding-top:6px;flex:0 0 auto}
.sheet.padoff .sh-foot{display:flex}
.padshow{flex:0 0 54px;height:54px;border-radius:14px;background:var(--surface-2);font-family:var(--f-display);font-weight:700;font-size:15px}
.sh-foot .save{margin-top:0;flex:1;width:auto}
.sh-err{font-size:13px;color:var(--spent);font-weight:600;padding:6px 2px 0;flex:0 0 auto}
/* the phone keyboard is up (a text box in the sheet has focus): the form gets the room */
@media (pointer:coarse){
  .sheet.typing .kpad,.sheet.typing .types,.sheet.typing .amt-cap,.sheet.typing .padshow{display:none}
  .sheet.typing .sh-foot{display:flex}
  .sheet.typing .amount{padding:4px 0 2px}
  .sheet.typing .amount #amt-val{font-size:26px}
  .sheet.typing .amount .cur{font-size:18px}
}
/* insights */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;margin-top:14px}
.seg button{height:36px;border-radius:9px;font-weight:700;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin:-4px 0 8px}
.legend span{display:flex;align-items:center;gap:6px}
.lg{display:inline-block;width:16px;height:0;border-top:2px solid var(--c-cur)}
.lg.prev{border-top:2px dashed var(--ink-2)}
.pace{width:100%;height:auto;display:block;touch-action:pan-y}
.pace .gl{stroke:var(--line);stroke-width:1}
.pace .yl,.pace .xl{fill:var(--ink-2);font-size:10px;font-family:var(--f-body)}
.pace .yl{text-anchor:end} .pace .xl{text-anchor:middle}
.pace .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.pace .ln.cur{stroke:var(--c-cur)}
.pace .ln.prev{stroke:var(--ink-2);stroke-dasharray:4 4;opacity:.75}
.pace .dot{fill:var(--c-cur);stroke:var(--surface);stroke-width:2}
.pace .guide{stroke:var(--ink-2);stroke-width:1}
.cap{margin:8px 0 0;font-size:13px;color:var(--ink-2);min-height:20px}
.cap b{color:var(--ink)}
.heat-h,.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat-h span{text-align:center;font-size:11px;font-weight:700;color:var(--ink-2);padding-bottom:4px}
.hd{aspect-ratio:1;max-width:100%;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink);background:var(--surface-2);font-variant-numeric:tabular-nums}
.hd.l1{background:color-mix(in srgb,var(--accent) 22%,var(--surface-2))}
.hd.l2{background:color-mix(in srgb,var(--accent) 45%,var(--surface-2))}
.hd.l3{background:color-mix(in srgb,var(--accent) 72%,var(--surface-2));color:var(--accent-ink)}
.hd.l4{background:var(--accent);color:var(--accent-ink)}
.hd.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.hd.fut{opacity:.35}
.heat-key{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:10px;font-size:11px;color:var(--ink-2)}
.heat-key i{width:14px;height:14px;border-radius:4px}
.bar-item{display:grid}
.cat-detail{padding:10px 0 4px}
.mini-cols{display:grid;gap:6px;align-items:end;height:76px}
.mc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.mc .b{width:100%;max-width:26px;border-radius:4px 4px 2px 2px;background:color-mix(in srgb,var(--c) 40%,transparent)}
.mc.cur .b{background:var(--c)}
.mc .x{font-size:10px;font-weight:700;color:var(--ink-2)}
.cols.y12{gap:4px} .cols.y12 .x{font-size:10px}
button.col{padding:0;min-width:0}
.clist{display:grid}
.crow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow > .sw{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.crow .cn{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cc{color:var(--ink-2);font-size:13px;font-variant-numeric:tabular-nums}
.cbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);background:var(--surface-2);flex:0 0 auto}
.cbtn svg{width:16px;height:16px}
.cbtn.on{background:var(--deep);color:var(--accent)}
.crow.edit{display:grid;gap:8px}
.say{display:flex;gap:8px;align-items:center;margin-top:10px}
.say .inp{height:44px;font-size:15px}
.mic{flex:0 0 44px;height:44px;border-radius:12px;background:var(--deep);color:var(--accent);display:grid;place-items:center}
.mic svg{width:20px;height:20px}
.mic.on{background:var(--spent);color:var(--bg);animation:pulse 1s ease-in-out infinite}
.heard{font-size:13px;color:var(--ink-2);margin-top:6px}
.heard b{color:var(--ink)}
.ubar{display:flex;align-items:center;gap:8px;width:100%;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px;text-align:left}
.ubar svg{width:16px;height:16px;flex:0 0 auto}
.ubar b{margin-left:auto;text-decoration:underline;text-underline-offset:3px}
.fab{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.icon-btn.unlocked{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.tag.priv{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--ink)}
.pin{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));overflow-y:auto}
.pin-card{width:100%;max-width:360px;display:grid;gap:14px;text-align:center}
.pin-ic{width:56px;height:56px;border-radius:18px;background:var(--deep);color:var(--accent);display:grid;place-items:center;margin:0 auto}
.pin-ic svg{width:26px;height:26px}
.pin-card h2{margin:0;font-family:var(--f-display);font-size:24px;text-wrap:balance}
.pin-card .sub{margin:0;color:var(--ink-2);min-height:21px}
.pin-card .sub.bad{color:var(--spent);font-weight:600}
.pin-dots{display:flex;justify-content:center;gap:14px;min-height:18px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-2)}
.pin-dots i.on{background:var(--ink);border-color:var(--ink)}
.pin .pad{border-top:0}
.pin-foot{display:flex;justify-content:space-between;gap:12px}
.code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:26px;font-weight:700;letter-spacing:.08em;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:16px;user-select:all}
.priv-list{display:flex;flex-wrap:wrap;gap:8px}
.chip.pv.on{background:var(--deep);border-color:var(--deep);color:var(--deep-ink)}
.sugg-box{background:var(--accent-soft);border-radius:12px;padding:12px;display:grid;gap:8px;text-align:left}
.sugg-box b{font-family:var(--f-display)}
.sugg-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
h1.page{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em;margin:0;text-wrap:balance}

/* hero */
.hero{background:var(--deep);color:var(--deep-ink);border-radius:22px;padding:20px 20px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;
  background:repeating-radial-gradient(circle, transparent 0 10px, rgba(255,255,255,.05) 10px 11px)}
.hero .lbl{font-size:13px;color:var(--deep-ink-2);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1.05;letter-spacing:-.03em;margin-top:4px}
.hero .cmp{font-size:14px;color:var(--deep-ink-2);margin-top:6px}
.hero .cmp b{color:var(--deep-ink);font-weight:600}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.mini{background:var(--deep-2);border-radius:12px;padding:10px 10px 9px;min-width:0}
.mini span{display:block;font-size:12px;color:var(--deep-ink-2)}
.mini b{display:block;font-family:var(--f-display);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* streak */
.streak{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.streak .s-txt b{font-family:var(--f-display);font-size:17px;display:block}
.streak .s-txt span{font-size:13px;color:var(--ink-2)}
.dots{display:flex;gap:6px}
.dot{display:grid;justify-items:center;gap:3px;font-size:10px;color:var(--ink-2);font-weight:600}
.dot i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.dot.on i{background:var(--accent);border-color:var(--accent)}
.dot.today i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent-soft)}

/* sections & list */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 8px;gap:12px}
.sec-h h2{font-family:var(--f-display);font-size:18px;margin:0;font-weight:700}
.sec-h a,.link{color:var(--ink-2);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.day{margin-top:14px}
.day-h{display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:0 4px 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.row.flash{animation:flash 1.2s ease}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.ic{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px;
  color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.ic svg{width:18px;height:18px}
.mid{flex:1;min-width:0}
.mid .t{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .m{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .n{display:block;font-size:13px;color:var(--ink-2);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);margin-left:6px;vertical-align:2px;font-style:normal}
.amt{text-align:right;font-family:var(--f-display);font-weight:700;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.amt small{display:block;font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.amt.in{color:var(--in)} .amt.lend{color:var(--lend)}
.tag.awaited{background:color-mix(in srgb,var(--lend) 15%,transparent);color:var(--lend)}
.tag.refunded{background:color-mix(in srgb,var(--in) 15%,transparent);color:var(--in)}

/* empty */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:22px;padding:28px 22px;text-align:center}
.empty h2{font-family:var(--f-display);font-size:24px;margin:8px 0 6px;text-wrap:balance}
.empty p{color:var(--ink-2);margin:0 auto 18px;max-width:36ch}
.empty .art{width:72px;height:72px;margin:0 auto;border-radius:22px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:36px;transform:rotate(-6deg)}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{height:44px;padding:0 18px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;gap:8px;background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:color-mix(in srgb,var(--spent) 14%,transparent);color:var(--spent)}
.btn.wide{width:100%;justify-content:center}
.muted{color:var(--ink-2)}

/* people */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.tile span{font-size:13px;color:var(--ink-2);display:block}
.tile b{font-family:var(--f-display);font-size:24px;font-weight:800;display:block;margin-top:2px}
.tile small{color:var(--ink-2);font-size:12px}
.av{flex:0 0 38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--f-display);background:var(--surface-2);color:var(--ink)}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.owe-you{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)}
.pill.you-owe{background:color-mix(in srgb,var(--spent) 15%,transparent);color:var(--spent)}
.pill.even{background:var(--surface-2);color:var(--ink-2)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:600;padding:6px 0 12px}
.person-hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}
.person-hero .nm{font-family:var(--f-display);font-size:30px;font-weight:800;letter-spacing:-.02em}
.person-hero .bal{font-size:16px;margin-top:4px}
.person-hero .bal b{font-family:var(--f-display);font-size:22px}
.person-hero .btns{justify-content:flex-start;margin-top:16px}

/* search */
.searchbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-top:14px}
.searchbar svg{width:18px;height:18px;color:var(--ink-2);flex:0 0 auto}
.searchbar input{border:0;background:none;outline:none;height:48px;flex:1;min-width:0;font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;margin-inline:-2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:0 0 auto}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .sw{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.on .sw{background:var(--c)}
.frow{margin-top:10px}
.more{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.more summary{padding:12px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"+";font-family:var(--f-display);font-size:18px;line-height:1}
.more[open] summary::after{content:"–"}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}
.fgrid .full{grid-column:1/-1}
.fld{display:grid;gap:4px;min-width:0}
.fld > span{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}
.inp{height:44px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:0 12px;width:100%;min-width:0;font-size:16px}
textarea.inp{height:auto;padding:10px 12px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.resbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between;margin:16px 4px 8px}
.resbar b{font-family:var(--f-display);font-size:18px}
.resbar span{font-size:13px;color:var(--ink-2)}
.resbar .clr{font-size:13px;font-weight:700;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}

/* insights */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
.mnav b{font-family:var(--f-display);font-size:17px}
.mnav button{width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.mnav button:disabled{opacity:.3;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.card h3{margin:0 0 12px;font-family:var(--f-display);font-size:16px;font-weight:700}
.bars{display:grid;gap:12px}
.bar-row{display:grid;gap:5px;width:100%}
.bar-top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.bar-top span:first-child{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.bar-top span:last-child{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:170px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.col .v{font-size:11px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.col .b{width:100%;max-width:38px;border-radius:8px 8px 3px 3px;background:var(--surface-2);min-height:3px}
.col.cur .b{background:var(--accent)}
.col .x{font-size:12px;font-weight:700;color:var(--ink-2)}
.col.cur .x{color:var(--ink)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0;padding-top:0}
.kv b{font-variant-numeric:tabular-nums}
/* home: refunds awaited and card dues */
.inflight{padding:14px 16px}
.inflight .if-sec{display:grid;gap:2px;width:100%;text-align:left}
.inflight .if-sec + .if-sec{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.inflight .if-h{font-family:var(--f-display);font-size:16px;font-weight:700;margin-bottom:4px}
.inflight .if-big{font-weight:700;color:var(--lend)}
.inflight .if-nudge{font-size:13px;font-weight:600;color:var(--spent)}
.inflight .if-note{font-size:13px;color:var(--ink-2);margin-top:4px}
.inflight .kv{padding:6px 0}
.inflight .if-h + .kv{border-top:0}
.inflight button.kv{width:100%;text-align:left;align-items:center}
.inflight button.kv span{flex:1;color:var(--ink-2)}
.inflight button.kv svg{width:18px;height:18px;color:var(--ink-2);margin-left:-4px}
/* card page: what's due, the statement day, and each billing period's bill against what you logged */
.card-hero .nm{display:flex;align-items:center;gap:10px}
.card-hero .nm svg{width:24px;height:24px;color:var(--ink-2);flex:0 0 auto}
.card-hero .note{font-size:13px;color:var(--ink-2);margin-top:6px}
.stmt{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;color:var(--ink-2)}
.stmt .link{color:var(--ink);font-size:15px;font-weight:700;padding:4px}
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.daygrid .chip{padding:0;justify-content:center;min-width:0}
.daygrid .chip.wide{grid-column:span 4}
.cyc{padding:0;overflow:hidden}
.cyc-h{display:grid;gap:5px;width:100%;text-align:left;padding:16px}
.cyc-t{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--f-display);font-size:17px;font-weight:700}
.cyc-t svg{width:18px;height:18px;color:var(--ink-2);flex:0 0 auto}
.cyc-h .paid{font-weight:600}
.vpill{justify-self:start;display:flex;align-items:center;gap:8px;margin-top:4px;padding:7px 10px;border-radius:10px;font-size:13px;font-weight:600;line-height:1.35;
  color:var(--c,var(--ink-2));background:color-mix(in srgb,var(--c) 12%,transparent)}
.vpill i{flex:0 0 8px;height:8px;border-radius:50%;background:currentColor}
.vpill.neutral{background:var(--surface-2)}
.cyc-rows{border-top:1px solid var(--line)}
/* add sheet, card bill: what Ledger thinks the bill is */
.billhint{display:flex;align-items:center;gap:8px;margin-top:10px;padding:6px 6px 6px 12px;border-radius:12px;background:var(--accent-soft);font-size:13px;line-height:1.35}
.billhint span{flex:1;min-width:0}
/* add sheet, money in: pick the expense it was for (it saves as money back on that expense) */
.linklist{padding:0;margin:0 0 10px;overflow:hidden}
.linklist button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--line)}
.linklist button:first-child{border-top:0}
.linklist b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linklist span{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:0 0 auto}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:6px max(16px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink-2);padding:6px 0;border-radius:12px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--accent)}
.fab{justify-self:center;width:62px;height:62px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:0 10px 22px -8px color-mix(in srgb,var(--accent) 70%,transparent);transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:28px;height:28px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;transition:opacity .22s}
.scrim.open{opacity:1}
/* --kb and --vvh follow the phone keyboard (see fitToKeyboard), so the sheet always sits in the part of the screen you can see */
.sheet{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:50;margin:0 auto;max-width:560px;max-height:94vh;display:flex;flex-direction:column;
  background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px -10px rgba(0,0,0,.3);
  padding:8px max(16px, env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.25,1)}
@supports (max-height:94dvh){.sheet{max-height:calc(var(--vvh, 100dvh) * .94)}}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 6px}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-head h2{margin:0;font-family:var(--f-display);font-size:18px;flex:1}
.sh-head .mic{flex:0 0 40px;width:40px;height:40px}
/* 7 types in two rows of four: labels only; what the chosen one means shows under the amount */
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 0 0}
.tbtn{height:38px;border:1px solid var(--line);border-radius:11px;padding:0 4px;background:var(--surface);min-width:0;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s}
.tbtn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.newcard{display:inline-flex;gap:6px;align-items:center}
.chip.wp{background:var(--accent-soft);border-color:transparent}
.chip.wp span{font-size:17px;line-height:1;color:var(--ink-2)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.qa button{display:grid;justify-items:center;align-content:start;gap:6px;padding:12px 4px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font-size:13px;font-weight:700;line-height:1.2;text-align:center;min-width:0}
.qa i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);font-style:normal}
.qa svg{width:18px;height:18px}
.person-hero .sub{font-size:14px;color:var(--ink-2);margin-top:8px}
.person-hero .sub b{color:var(--ink);font-family:var(--f-display);font-size:18px}
.amount{display:grid;justify-items:center;padding:8px 0 4px;cursor:text;user-select:none;flex:0 0 auto}
.amt-line{display:flex;align-items:baseline;gap:4px;font-family:var(--f-display);font-weight:800}
.amount .cur{font-size:24px;color:var(--ink-2)}
.amount #amt-val{font-size:44px;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.amt-cap{font-size:13px;color:var(--ink-2);margin-top:2px}
.amount.zero #amt-val{color:var(--ink-2);opacity:.45}
.amount.bump #amt-val{animation:bump .14s ease}
@keyframes bump{50%{transform:scale(1.05)}}
.shake{animation:shake .35s ease}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.sh-body{flex:1;overflow-y:auto;display:grid;gap:14px;align-content:start;padding:4px 2px 12px;min-height:80px}
#quick:empty{display:none} /* no usuals: no empty gap in the form */
.quick-h{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.qp{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.qp b{font-variant-numeric:tabular-nums}
.sugg{display:grid;gap:4px;margin-top:6px}
.sugg button{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;background:var(--surface-2);text-align:left;font-size:14px}
.sugg button span{color:var(--ink-2);white-space:nowrap}
.hint{font-size:13px;color:var(--ink-2);margin-top:6px}
.hint b{color:var(--ink)}
.err{font-size:13px;color:var(--spent);font-weight:600;margin-top:4px}
.date-inp{height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-weight:600;font-size:14px}
.date-inp.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-top:6px;border-top:1px solid var(--line)}
.pad button{height:48px;border-radius:12px;background:var(--surface-2);font-family:var(--f-display);font-size:22px;font-weight:700;display:grid;place-items:center}
.pad button:active{background:var(--line)}
.pad svg{width:22px;height:22px}
.save{margin-top:8px;height:54px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:17px;width:100%;flex:0 0 auto}
.save:active{transform:scale(.99)}
.done{position:absolute;inset:0;border-radius:24px 24px 0 0;background:var(--surface);display:grid;place-items:center;z-index:2}
.done .ring{width:96px;height:96px;border-radius:50%;background:var(--accent);display:grid;place-items:center;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.done svg{width:52px;height:52px;color:var(--accent-ink)}
.done path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .35s .12s ease forwards}
.done p{font-family:var(--f-display);font-weight:800;font-size:22px;margin:14px 0 0;text-align:center}
.done-in{display:grid;justify-items:center}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.sheet .del{color:var(--spent);font-weight:700;justify-self:start;padding:6px 0}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:60;
  background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px 12px 16px;display:flex;gap:14px;align-items:center;
  width:max-content;max-width:calc(100vw - 32px);font-weight:600;font-size:14px;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--accent);font-weight:800}
.status{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--in)}
.status i.local{background:var(--accent)}
.stack{display:grid;gap:10px}
pre.export{max-height:180px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;white-space:pre-wrap;word-break:break-all}

@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} .done path{stroke-dashoffset:0} }
@media (max-width:380px){ .hero .big{font-size:38px} .mini b{font-size:15px} .amount #amt-val{font-size:40px} }
</style>
</head>
<body>

<div class="app">
  <main id="main" aria-live="polite"></main>
</div>

<nav class="nav" aria-label="Main">
  <div class="nav-in">
    <button class="tab" data-act="nav" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button class="tab" data-act="nav" data-v="people"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .7 3.2 2.4 3.6 5.2"/></svg>People</button>
    <button class="fab" data-act="add" aria-label="Add entry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-act="nav" data-v="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>Search</button>
    <button class="tab" data-act="nav" data-v="insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Insights</button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sh-title">
  <div class="grab"></div>
  <!-- fixed top, kept small so the form gets the room: title, mic, close; type buttons; amount -->
  <div class="sh-head">
    <h2 id="sh-title">New entry</h2>
    <button class="mic" id="mic-btn" data-act="mic" aria-label="Speak an entry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
    <button class="icon-btn" data-act="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="types" id="sh-types" role="group" aria-label="Entry type"></div>
  <div class="amount zero" id="sh-amount" role="button" tabindex="0" aria-label="Amount">
    <div class="amt-line"><span class="cur">₹</span><span id="amt-val">0</span></div>
    <div class="amt-cap" id="amt-cap"></div>
  </div>
  <!-- scrolling middle: the details -->
  <div class="sh-body" id="sh-body">
    <div id="say">
      <label class="fld"><span>Type it in one line</span>

<script>
(() => {
'use strict';
/* ---------- constants ---------- */
const TYPES = {
  spent:    {label:'Spent',     cap:'Money out',       sign:-1, kind:'flow', person:'Spent with',    bal:0},
  received: {label:'Received',  cap:'Money in',        sign: 1, kind:'flow', person:'Received from', bal:0},
  lent:     {label:'Lent',      cap:'They owe you',    sign:-1, kind:'debt', person:'Lent to',       bal: 1},
  borrowed: {label:'Borrowed',  cap:'You owe them',    sign: 1, kind:'debt', person:'Borrowed from', bal:-1},
  gotback:  {label:'Got back',  cap:'They repaid you', sign: 1, kind:'debt', person:'Got back from', bal:-1},
  paidback: {label:'Paid back', cap:'You repaid them', sign:-1, kind:'debt', person:'Paid back to',  bal: 1},
  // paying a credit card bill: money leaves the bank, but the card spends were already counted, so it isn't spending
  cardbill: {label:'Card bill', cap:'Not spending',    sign:-1, kind:'bill', person:'',              bal:0},
};
const DEFAULT_CATS = ['Food','Groceries','Transport','Bills','Shopping','Rent','Health','Fun','Travel','Gifts','Other'];
const CAT_COLORS = {Food:'#E0862A',Groceries:'#4F9A3A',Transport:'#3B7DC4',Bills:'#8A5CC2',Shopping:'#D0517E',Rent:'#A0702E',
  Health:'#D1453B',Fun:'#B84FC4',Travel:'#1E9AA0',Gifts:'#E2683C',Other:'#7A8A84',Salary:'#1B8455',Freelance:'#2E8F6E'};
const PALETTE = ['#E0862A','#3B7DC4','#4F9A3A','#8A5CC2','#D0517E','#1E9AA0','#A0702E','#D1453B','#B84FC4'];
const MODES = ['UPI','Cash','Card','Other'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const LS_MODE = 'ledger-mode';
const APP_VERSION = 'v19';
window.__ledgerBusy = () => !!(typeof openEl !== 'undefined' && openEl) || !$('#pin').hidden || !$('#quickbox').hidden;
const ICON = {
  bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>',
  unlock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 7.6-1.7"/></svg>',
  group:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .7 3.2 2.4 3.6 5.2"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>',
  in:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17M15 17H7V9"/></svg>',
  back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>',
  del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12zM17 9l-6 6M11 9l6 6"/></svg>',
  card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h3"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
};

/* ---------- state ---------- */
const S = {
  entries: [], everything: [], all: new Map(), unlocked: false, hiddenCount: 0, view:'home', person:null, mode:'local', loading:false,
  f: freshFilters(),
  im: null,            // insights month {y,m}
  card: null, cardPick: false, duePick: false, cardOpen: {},  // card page: which card, statement-day / due-day picker open, periods opened/closed
  flashId: null,
};
function freshFilters(){ return {q:'', types:[], range:'all', from:'', to:'', person:'', cat:'', mode:'', min:'', max:'', note:false, sort:'date-desc'}; }

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('en-IN', {maximumFractionDigits:2});
const rupee = n => '₹' + nf.format(Math.abs(Math.round(n*100)/100));
const pad2 = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const todayKey = () => keyOf(new Date());
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const fmtDate = k => { const d = parseKey(k); return `${pad2(d.getDate())} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const dayLabel = k => {
  const t = todayKey();
  if (k === t) return 'Today';
  if (k === addDays(t,-1)) return 'Yesterday';
  const d = parseKey(k), cur = new Date().getFullYear();
  return `${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}${d.getFullYear()!==cur ? ' '+d.getFullYear() : ''}`;
};
const short = n => {
  n = Math.abs(n);
  if (n >= 1e7) return '₹' + (n/1e7).toFixed(1).replace(/\.0$/,'') + 'Cr';
  if (n >= 1e5) return '₹' + (n/1e5).toFixed(1).replace(/\.0$/,'') + 'L';
  if (n >= 1e3) return '₹' + (n/1e3).toFixed(1).replace(/\.0$/,'') + 'k';
  return '₹' + Math.round(n);
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const hashColor = s => { let h=0; for (const c of s) h = (h*31 + c.charCodeAt(0))|0; return PALETTE[Math.abs(h)%PALETTE.length]; };
const catColor = c => CAT_COLORS[c] || hashColor(c || 'x');
const initial = s => (s||'?').trim().charAt(0).toUpperCase() || '?';
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch {} };
const buzz = () => { try { navigator.vibrate && navigator.vibrate(12); } catch {} };
const byRecent = (a,b) => (b.date.localeCompare(a.date)) || ((b.createdAt||0)-(a.createdAt||0));

/* ---------- derived data ---------- */
/* people on a shared expense: e.with (new) or the old single person on a spent entry */
function withOf(e){ return (e.with && e.with.length) ? e.with : (e.type === 'spent' && e.person ? [e.person] : []); }
/* money people paid you back for their share of a shared expense, by lowercase name */
function repaidOf(e, name){ const pb = e.paidBack || {}; return name == null ? Object.values(pb).reduce((s, v) => s + (+v || 0), 0) : (+pb[lc(name)] || 0); }
/* the amount after any refund (awaited or arrived): a ₹1,500 ticket with ₹1,320 coming back came to ₹180 */
function netOf(e){ return e.type === 'spent' && e.refund ? Math.max(0, e.amount - (+e.refund.amount || 0)) : e.amount; }
/* what an entry really cost you: the amount after refunds, minus what people paid back for their shares */
function cost(e){ return e.type === 'spent' ? Math.max(0, netOf(e) - repaidOf(e)) : e.amount; }
function shareOf(e){ const w = withOf(e); return netOf(e) / Math.max(1, w.length + (e.incMe === false ? 0 : 1)); }
function involves(e, name){ const n = name.toLowerCase(); return (e.type !== 'spent' && (e.person||'').toLowerCase() === n) || withOf(e).some(x => x.toLowerCase() === n); }
function peopleIndex(){
  const m = new Map();
  const get = (name, date) => {
    const k = name.toLowerCase(); let p = m.get(k);
    if (!p){ p = {name, bal:0, count:0, last:'', debt:false, treat:0, treats:0}; m.set(k,p); }
    p.count++; if (date > p.last){ p.last = date; p.name = name; }
    return p;
  };
  for (const e of S.entries){
    const t = TYPES[e.type];
    if (e.person && e.type !== 'spent'){
      const p = get(e.person, e.date);
      if (t.kind === 'debt'){ p.debt = true; p.bal += t.bal * (e.amount - (e.prior || 0)); }
    }
    const w = withOf(e);
    if (w.length){ const sh = shareOf(e); for (const n of w){ const p = get(n, e.date), back = Math.min(sh, repaidOf(e, n)); p.treat += sh - back; p.treats++; p.repaid = (p.repaid || 0) + back; if (sh - back > 0.5) p.unsettled = (p.unsettled || 0) + 1; } }
  }
  for (const p of m.values()){ p.bal = Math.round(p.bal*100)/100; p.treat = Math.round(p.treat*100)/100; }
  return m;
}
/* ---------- credit cards and refunds (the same rules as the Android app's Cards.kt) ----------
   Card due = everything charged to the card − refunds that came back to it − bills paid.
   A card spend counts in full here, even a shared dinner: the card was charged the whole bill. */
const daysBetween = (from, to) => Math.round((parseKey(to) - parseKey(from)) / 864e5);
const REFUND_NUDGE_DAYS = 7; // refunds still waiting after this many days get a nudge on Home
/* every card you've named, on any entry, newest use first, plus any from card settings */
function cardNames(){
  const recent = [...S.everything].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  return uniqCI([...recent.flatMap(e => [e.card, e.refund && e.refund.card]), ...cardSettings().map(c => c.name)]);
}
const isCardSpend = (e, name) => e.type === 'spent' && lc(e.mode) === 'card' && lc(e.card) === lc(name);
function cardDues(list = S.entries){
  return cardNames().map(name => {
    const charged = list.filter(e => isCardSpend(e, name)).reduce((s, e) => s + e.amount, 0);
    const refunded = list.filter(e => e.type === 'spent' && e.refund && e.refund.status === 'received' && lc(e.refund.to) === 'card' && lc(e.refund.card) === lc(name))
      .reduce((s, e) => s + (+e.refund.amount || 0), 0);
    const paid = list.filter(e => e.type === 'cardbill' && lc(e.card) === lc(name)).reduce((s, e) => s + e.amount, 0);
    // paid more than Ledger saw charged: interest, fees, spends you didn't log, or a balance from before Ledger
    return {name, due: Math.max(0, charged - refunded - paid), notLogged: Math.max(0, paid - (charged - refunded))};
  });
}
/* ---------- matching bills against card spends (the same rules as Cards.kt: cardCycles, suggestedBill) ----------
   Card settings live in one record, cfg-cards: {cards: [{name: 'HDFC', statementDay: 15, dueDay: 3}, {name: 'SBI'}]}.
   A statement day is the day of the month the card's statement closes (1–31); the due day is when the bill is due. */
const CARDS_ID = 'cfg-cards';
function cardSettings(){ const r = S.all.get(CARDS_ID); return (r && !r.deleted && Array.isArray(r.cards)) ? r.cards.filter(c => c && c.name) : []; }
/* one card's setting [field] ('statementDay' or 'dueDay') as a day 1–31, or null when it isn't set */
function cardDayOf(name, field){
  const c = cardSettings().find(c => lc(c.name) === lc(name)), d = c ? Math.round(+c[field]) : 0;
  return d >= 1 && d <= 31 ? d : null;
}
const statementDayOf = name => cardDayOf(name, 'statementDay');
const dueDayOf = name => cardDayOf(name, 'dueDay');
/* change some of one card's settings, e.g. {dueDay: 3} (null clears one). Its other settings and the other cards stay as they are. */
function saveCardSettings(name, patch){
  const list = cardSettings(), i = list.findIndex(c => lc(c.name) === lc(name));
  const card = {...(i < 0 ? {name} : list[i]), ...patch};
  for (const k of ['statementDay', 'dueDay']) if (!card[k]) delete card[k];
  const cards = i < 0 ? [...list, card] : list.map((c, j) => j === i ? card : c);
  return store.put({id: CARDS_ID, cards}); // synced like the other cfg- records
}
/* the next time a bill due on day [dueDay] is due: this month's (if it's today or later), else next month's */
function nextDueDate(dueDay, today = todayKey()){
  const [y, m] = yearMonth(today), thisMonth = closingIn(y, m, dueDay);
  return thisMonth >= today ? thisMonth : closingIn(y, m + 1, dueDay);
}
/* day [day] of a month, or its last day when the month is shorter (a statement on the 31st in February).
   m is 1–12; 0 or 13 roll into the year before or after. */
function closingIn(y, m, day){
  const first = new Date(y, m - 1, 1), yy = first.getFullYear(), mm = first.getMonth() + 1;
  return `${yy}-${pad2(mm)}-${pad2(Math.min(day, new Date(yy, mm, 0).getDate()))}`;
}
const yearMonth = k => k.slice(0, 7).split('-').map(Number);                                      // '2026-11-09' → [2026, 11]
const monthBefore = k => { const [y, m] = yearMonth(k); return closingIn(y, m - 1, +k.slice(8)); }  // 31 Mar → 28 Feb
/* One card's billing periods, newest first, ending with the one still open today. Each one:
   {from, to, open, charges, charged, refunded, bills, paid, logged, difference, verdict}
   With a statement day: the statement period (16 Oct – 15 Nov), and the bills paid after it closed and before
   the next one closed. Without one: from the day after one bill up to the next bill.
   Charges count by the spend's date; refunds back to the card by the day they arrived. */
function cardCycles(list, card, statementDay, today){
  const charges = list.filter(e => isCardSpend(e, card));
  const refunds = list.filter(e => e.type === 'spent' && e.refund && e.refund.status === 'received' && lc(e.refund.to) === 'card'
    && lc(e.refund.card) === lc(card) && e.refund.received).map(e => e.refund);
  const bills = list.filter(e => e.type === 'cardbill' && lc(e.card) === lc(card)).sort((a, b) => a.date.localeCompare(b.date));
  if (!charges.length && !bills.length) return [];
  const sum = (xs, f) => Math.round(xs.reduce((s, x) => s + (+f(x) || 0), 0) * 100) / 100;
  const cycle = (from, to, open, paidBy) => {
    const inside = d => (!from || d >= from) && d <= to;
    const ch = charges.filter(e => inside(e.date)).sort(byRecent);
    const c = {from, to, open, charges: ch, charged: sum(ch, e => e.amount), refunded: sum(refunds.filter(r => inside(r.received)), r => r.amount),
               bills: paidBy, paid: sum(paidBy, e => e.amount)};
    c.logged = Math.round((c.charged - c.refunded) * 100) / 100;
    c.difference = Math.round((c.paid - c.logged) * 100) / 100;
    c.verdict = open ? 'open' : !paidBy.length ? 'notpaid' : Math.abs(c.difference) <= 1 ? 'matches'  // ₹1 of rounding on a statement
      : c.difference > 0 ? 'more' : 'less';
    return c;
  };
  const out = [];
  if (statementDay){
    // start one statement before the earliest spend or bill: a bill pays the statement that closed before it
    const first = [...charges, ...bills].map(e => e.date).sort()[0], [fy, fm] = yearMonth(first);
    let end = closingIn(fy, fm - 1, statementDay);
    if (end < monthBefore(first)) end = closingIn(fy, fm, statementDay);
    for (;;){
      const [ey, em] = yearMonth(end);
      const start = addDays(closingIn(ey, em - 1, statementDay), 1), nextEnd = closingIn(ey, em + 1, statementDay);
      const open = end >= today;
      const paidBy = open ? [] : bills.filter(b => b.date > end && b.date <= nextEnd); // paid after it closed, before the next one closed
      const c = cycle(start, end, open, paidBy);
      if (open || c.charges.length || c.bills.length || c.refunded > 0) out.push(c); // skip empty months
      if (open) break;
      end = nextEnd;
    }
  } else {
    let from = null;
    for (const b of bills){ out.push(cycle(from, b.date, false, [b])); from = addDays(b.date, 1); }
    out.push(cycle(from, today, true, []));
  }
  return out.reverse();
}

  const backFrom = refund && refund.from ? refund.from : '';

  const w = withOf(e);
  if (w.length) meta.push('with ' + esc(w.slice(0,2).join(', ')) + (w.length > 2 ? ` +${w.length-2}` : ''));
  else if (e.person && !(isDebt && !e.desc)) meta.push(esc(e.person));
  if (e.prior > 0) meta.push(e.prior >= e.amount ? 'loan from before Ledger' : rupee(e.prior) + ' from before Ledger');
  const theirs = (opts.who && w.some(x => x.toLowerCase() === opts.who)) ? (repaidOf(e, opts.who) >= shareOf(e) - 0.5 ? 'paid back' : rupee(shareOf(e)) + ' theirs') : '';
  if (repaidOf(e) > 0 && !opts.who) meta.push(rupee(repaidOf(e)) + ' paid back');
  // a refund shows what was paid and what's coming back, so the smaller amount on the right makes sense
  if (refund) meta.push(`${rupee(e.amount)} paid · ${rupee(refund.amount)} ` + (backFrom
    ? (refund.status === 'awaited' ? 'awaited from ' : 'back from ') + esc(backFrom)
    : (refund.status === 'awaited' ? 'refund awaited' : 'refunded')));
  if (e.cat && t.kind === 'flow') meta.push(esc(e.cat));
  if (isBill) meta.push('not spending');
  if (e.mode) meta.push(e.mode === 'Card' && e.card ? esc(e.card) + ' card' : esc(e.mode));
  if (opts.showDate) meta.push(esc(fmtDate(e.date)));
  const cls = e.type==='received' ? 'in' : (isDebt ? 'lend' : '');
  const sign = t.sign < 0 ? '−' : '+';
  return `<button class="row${S.flashId===e.id?' flash':''}" data-act="open" data-id="${esc(e.id)}">
    <span class="ic" style="--c:${color}">${icon}</span>
    <span class="mid"><span class="t">${esc(title)}${tags.join('')}${S.unlocked && isPrivate(e) ? '<span class="tag priv">Private</span>' : ''}${e.sample?'<span class="tag">Example</span>':''}</span>
      ${meta.length?`<span class="m">${meta.join(' · ')}</span>`:''}
      ${e.note?`<span class="n">“${esc(e.note)}”</span>`:''}</span>
    <span class="amt ${cls}">${sign}${rupee(refund ? netOf(e) : e.amount)}${theirs ? `<small>${theirs}</small>` : (isDebt||e.type==='received'?`<small>${t.label}</small>`:'')}</span>
  </button>`;
}
function groupedList(list, opts={}){
  const groups = new Map();
  for (const e of list){ if (!groups.has(e.date)) groups.set(e.date, []); groups.get(e.date).push(e); }
  let h = '';
  for (const [k, items] of groups){
    const spent = items.filter(e=>e.type==='spent').reduce((s,e)=>s+cost(e),0);
    h += `<div class="day"><div class="day-h"><span>${esc(dayLabel(k))}</span><span class="num">${spent?'Spent '+rupee(spent):''}</span></div>
      <div class="list">${items.map(e=>rowHtml(e,opts)).join('')}</div></div>`;
  }
  return h;
}

/* money on its way: refunds awaited, and every card you've named with what's due on it. Only shown when there's some. */
function inFlightCard(){
  const awaited = refundsAwaited(), cards = cardDues();
  if (!awaited.length && !cards.length) return '';
  const parts = [];
  if (awaited.length){
    const total = awaited.reduce((s, a) => s + a.amount, 0), old = awaited.find(a => a.days >= REFUND_NUDGE_DAYS);
    parts.push(`<button class="if-sec" data-act="nav" data-v="search" aria-label="Refunds awaited. Open search"><span class="if-h">Refunds</span>
      <span class="if-big num">${rupee(total)} · ${awaited.length} refund${awaited.length === 1 ? '' : 's'} awaited</span>
      ${old ? `<span class="if-nudge">${esc(old.e.desc || old.e.cat || 'Refund')}: waiting ${old.days} days. Worth checking?</span>` : ''}</button>`);
  }
  if (cards.length){
    const notes = cards.filter(c => c.notLogged > 0).map(c => `${esc(c.name)}: ${rupee(c.notLogged)} paid that isn't logged in Ledger (fees, interest or older spends)`);
    // each card opens its own page: bills matched with what was spent on it
    parts.push(`<div class="if-sec"><span class="if-h">Card due</span>
      ${cards.map(c => `<button class="kv" data-act="cardpage" data-c="${esc(c.name)}" aria-label="Open ${esc(c.name)}"><span>${esc(c.name)}</span><b>${rupee(c.due)}</b>${ICON.next}</button>`).join('')}
      ${notes.length ? `<span class="if-note">${notes.join(' · ')}</span>` : ''}</div>`);
  }
  return `<div class="card inflight">${parts.join('')}</div>`;
}

function viewPerson(){
  const name = S.person, key = (name||'').toLowerCase();
  const p = peopleIndex().get(key);
  if (!p){ S.view='people'; return viewPeople(); }

  let line;
  if (p.bal > 0) line = `${esc(p.name)} owes you <b class="num" style="color:var(--in)">${rupee(p.bal)}</b>`;
  else if (p.bal < 0) line = `You owe ${esc(p.name)} <b class="num" style="color:var(--spent)">${rupee(p.bal)}</b>`;
  else line = p.debt ? 'All settled. Nothing pending.' : 'No lending or borrowing yet.';
  const sumT = (type, f = () => true) => S.everything.filter(e => e.type === type && lc(e.person) === key && f(e)).reduce((s, e) => s + e.amount - (e.prior || 0), 0);
  let fix = '';
  if (p.bal > 0){
    const extra = Math.min(p.bal, Math.max(0, sumT('paidback') - sumT('borrowed')));
    if (extra > 0) fix = `<div class="ask" style="margin-top:12px"><p>${rupee(extra)} of this comes from paying ${esc(p.name)} back with no matching loan in Ledger. If you borrowed it before you started using Ledger, it shouldn't count.</p><div><button class="btn primary" data-act="fixprior" data-t="paidback" data-n="${esc(p.name)}">It was from before. Fix it</button></div></div>`;
  } else if (p.bal < 0){
    const extra = Math.min(-p.bal, Math.max(0, sumT('gotback') - sumT('lent')));
    if (extra > 0) fix = `<div class="ask" style="margin-top:12px"><p>${rupee(extra)} of this comes from ${esc(p.name)} returning money with no matching loan in Ledger. If you lent it before you started using Ledger, it shouldn't count.</p><div><button class="btn primary" data-act="fixprior" data-t="gotback" data-n="${esc(p.name)}">It was from before. Fix it</button></div></div>`;
  }
  const treat = (p.treat || p.repaid) ? `<div class="sub">Spent on ${esc(p.name)}: <b class="num">${rupee(p.treat)}</b> across ${p.treats} shared expense${p.treats===1?'':'s'}${p.repaid ? ` · paid you back ${rupee(p.repaid)}` : ''}</div>` : '';
  const btns = [];
  if (p.unsettled) btns.push(`<button class="btn primary" data-act="sharepaid" data-n="${esc(p.name)}">${esc(p.name)} paid their share</button>`);
  if (p.bal > 0) btns.push(`<button class="btn primary" data-act="add" data-type="gotback" data-person="${esc(p.name)}" data-amount="${p.bal}">Got it back</button>`);
  if (p.bal < 0) btns.push(`<button class="btn primary" data-act="add" data-type="paidback" data-person="${esc(p.name)}" data-amount="${-p.bal}">I paid back</button>`);
  btns.push(`<button class="btn" data-act="add" data-type="spent" data-person="${esc(p.name)}">Spent with</button>`);
  btns.push(`<button class="btn" data-act="add" data-type="lent" data-person="${esc(p.name)}">Lend</button>`);
  btns.push(`<button class="btn" data-act="add" data-type="borrowed" data-person="${esc(p.name)}">Borrow</button>`);
  return `<button class="back" data-act="nav" data-v="people">${ICON.back}People</button>
    <div class="person-hero"><div class="nm">${esc(p.name)}</div><div class="bal">${line}</div>${treat}${fix}<div class="btns">${btns.join('')}</div></div>
    <div class="sec-h"><h2>History</h2><span class="muted" style="font-size:13px">${list.length} entries</span></div>
    ${groupedList(list, {who:key})}`;
}

function filtered(){
  const f = S.f, t = todayKey();
  let from = '', to = '';
  if (f.range==='7d'){ from = addDays(t,-6); to = t; }
  if (f.range==='month'){ from = t.slice(0,8)+'01'; to = t; }
  if (f.range==='lastmonth'){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); from = keyOf(d); const e = new Date(d.getFullYear(), d.getMonth()+1, 0); to = keyOf(e); }
  if (f.range==='custom'){ from = f.from; to = f.to; }
  const q = f.q.trim().toLowerCase();
  const min = parseFloat(f.min), max = parseFloat(f.max);
  let r = S.entries.filter(e => {
    if (f.types.length && !f.types.includes(e.type)) return false;
    if (from && e.date < from) return false;
    if (to && e.date > to) return false;
    if (f.person && !involves(e, f.person)) return false;
    if (f.cat && e.cat !== f.cat) return false;
    if (f.mode && e.mode !== f.mode) return false;
    if (!isNaN(min) && e.amount < min) return false;
    if (!isNaN(max) && e.amount > max) return false;
    if (f.note && !e.note) return false;
    if (q){
      const hay = [e.desc,e.person,withOf(e).join(' '),e.cat,e.note,e.mode,e.card,TYPES[e.type].label,e.refund ? 'refund money back ' + (e.refund.from || '') : '',String(e.amount),fmtDate(e.date)].join(' ').toLowerCase();
      if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  });
  const s = f.sort;

/* the amount after one key: at most 9 digits before the point and 2 after it. Returns s unchanged when the key doesn't fit. */
function nextAmount(s, k){
  if (k === 'del') return s.slice(0, -1);
  if (k === '.') return s.includes('.') ? s : (s || '0') + '.';
  if (k === '00') return (!s || s === '0') ? s : nextAmount(nextAmount(s, '0'), '0'); // two zeros, never on an empty amount
  if (s.includes('.')){ if (s.split('.')[1].length >= 2) return s; }
  else if (s.replace(/^0+/, '').length >= 9) return s;
  return s === '0' ? k : s + k;
}

  }
  const multi = D.type === 'spent';
  if (multi && $('#f-person').value.trim()) addWithName($('#f-person').value);

  const person = (multi || bill) ? '' : canonPerson($('#f-person').value);
  if (t.kind === 'debt' && !person){
    const f = $('#f-person'); setErr('Add who this was with, so the balance adds up'); shake(f.parentElement); f.focus(); return;
  }

  };

  if (multi && D.refundOn && !(refundBack() > 0)){ formError('#refund-wrap', 'Type how much is coming back'); return; }
  setErr('');
  if (D.type === 'received' && D.linkTo){ saveAsMoneyBack(amount, person); return; }
  if (D.type === 'gotback' || D.type === 'paidback'){
    if (!D.priorAsked){
      const ex = settleExcess(D.type, person, amount, D.editId);
      if (ex > 0){
        const part = ex >= amount ? 'this' : rupee(ex) + ' of this';
        const msg = D.type === 'paidback'
          ? `Ledger has no record of you borrowing ${part} from ${esc(person)}. Did you borrow it before you started using Ledger?`
          : `Ledger has no record of ${esc(person)} borrowing ${part} from you. Did you lend it before you started using Ledger?`;
        $('#person-hint').innerHTML = `<div class="ask"><p>${msg}</p><div class="btns" style="justify-content:flex-start"><button class="btn primary" data-act="prioryes">Yes, from before</button><button class="btn" data-act="priorno">No, save as it is</button></div></div>`;
        setPad(false); buzz();
        setTimeout(() => { const h = $('#person-hint .ask'); h && h.scrollIntoView({block: 'center', behavior: 'smooth'}); }, 30);
        return;
      }
      D.prior = 0;
    }
  } else D.prior = 0;
  const prev = D.editId ? S.entries.find(x=>x.id===D.editId) : null;
  const firstToday = !prev && !loggedDays().has(todayKey());
  const e = {
    id: D.editId || uid(), type: D.type, amount, desc: $('#f-desc').value.trim(), person,
    cat: t.kind !== 'flow' ? '' : (D.cat || (D.type==='spent' ? 'Other' : '')), mode: bill && D.mode === 'Card' ? 'UPI' : D.mode, date: D.date || todayKey(),
    note: $('#f-note').value.trim(), createdAt: prev?.createdAt || Date.now(), updatedAt: Date.now(),

  // which card: required on a card bill, optional on a spend paid by card, dropped everywhere else
  if ((bill || (multi && D.mode === 'Card')) && D.card) e.card = D.card;
  if (multi && D.refundOn){
    const r = {amount: Math.round(Math.min(refundBack(), amount) * 100) / 100, status: D.refundArrived ? 'received' : 'awaited',
               confirmed: (prev && prev.refund && prev.refund.confirmed) || todayKey()}; // keeps the day it was first confirmed

  try { await store.put(e); }
  catch { saving = false; toast("Couldn't save. Check your connection and try again."); return; }
  saving = false;
  lsSet(LS_MODE, D.mode);
  S.flashId = e.id; buzz();
  const st = streak();
  $('#done-txt').textContent = prev ? 'Updated' : (firstToday && st > 1 ? `${st}-day streak` : 'Logged');
  $('#done').hidden = false;
  render();
  setTimeout(() => {
    closeSheet();
    toast(!S.unlocked && isPrivate(e) ? 'Saved privately' : prev ? 'Entry updated' : `Logged ${rupee(amount)}${e.desc ? ' · '+e.desc : bill ? ` · ${e.card} card bill` : ''}${e.with ? ' · with ' + e.with.length + (e.with.length===1 ? ' person' : ' people') : ''}`);
  }, 650);
}
/* Money in that was for an expense ("Dad gave me 1,500 for the treat"): no Received entry is saved. Instead it
   becomes money back on that expense, so the expense's month shows what it really cost you (the Android app does the same). */
async function saveAsMoneyBack(amount, person){
  const target = S.entries.find(x => x.id === D.linkTo);
  if (!target){ D.linkTo = null; renderLink(); setErr("That expense isn't there any more. Pick another."); return; }
  const back = Math.min(amount, target.amount), day = D.date || todayKey();
  const refund = {amount: back, status: 'received', confirmed: day, received: day, to: D.mode === 'Card' ? 'Card' : D.mode};
  if (person) refund.from = person;
  const prev = D.editId ? S.entries.find(x => x.id === D.editId) : null; // a Received entry being turned into money back
  saving = true;
  try {
    await store.put({...target, refund, updatedAt: Date.now()});
    if (prev) await store.remove(prev.id); // deleted like any other entry, so other devices drop it too
  } catch { saving = false; toast("Couldn't save. Check your connection and try again."); return; }
  saving = false;
  lsSet(LS_MODE, D.mode);
  S.flashId = target.id; buzz();
  $('#done-txt').textContent = 'Saved as money back';
  $('#done').hidden = false;
  render();
  const name = target.desc || target.cat || 'the expense';
  setTimeout(() => { closeSheet(); toast(`${rupee(back)} back on ${name} · counts as ${rupee(Math.max(0, target.amount - back))} spent`); }, 650);
}

function toCSV(){
  const head = ['Date','Type','Amount','Description','Person','Category','Paid with','Comment','Spent with','My share included'];
  const q = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  return [head.join(','), ...[...S.entries].sort(byRecent).map(e => [e.date, TYPES[e.type].label, e.amount, e.desc, e.type==='spent' ? '' : e.person, e.cat, e.mode, e.note, withOf(e).join('; '), withOf(e).length ? (e.incMe===false ? 'No' : 'Yes') : ''].map(q).join(','))].join('\n');
}
function doExport(fmt){
  const data = fmt==='csv' ? toCSV() : JSON.stringify({app:'ledger', version:1, exported:new Date().toISOString(), entries:S.entries.map(cleanRec)}, null, 1);
  const filename = `ledger-${todayKey()}.${fmt}`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type: fmt==='csv' ? 'text/csv' : 'application/json'}));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast(`Saved ${filename}`);
}
async function doImport(file){
  try {
    const parsed = JSON.parse(await file.text());
    const list = (Array.isArray(parsed) ? parsed : parsed.entries || []).filter(validEntry);
    if (!list.length){ toast('No entries found in that file.'); return; }
    closeSheet(); toast(`Importing ${list.length} entries…`);
    await store.putMany(list);
    toast(`Imported ${list.length} entries`);
  } catch { toast("That file isn't a Ledger backup."); }
}

/* The phone keyboard covers the bottom of the screen. Some browsers shrink the page for it, others only the
   visible part (visualViewport). Either way: lift the sheet above it (--kb), fit it in what's left (--vvh),
   and keep the box being typed in where you can see it. */
function fitToKeyboard(){
  const vv = window.visualViewport, root = document.documentElement.style;
  if (!vv || Math.abs(vv.scale - 1) > 0.01){ root.removeProperty('--kb'); root.removeProperty('--vvh'); return; } // zoomed in: leave it
  root.setProperty('--kb', Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) + 'px');
  root.setProperty('--vvh', Math.round(vv.height) + 'px');
  const a = document.activeElement;
  if (sheet.classList.contains('typing') && a && $('#sh-body').contains(a)) setTimeout(() => a.scrollIntoView({block: 'nearest'}), 50);
}
if (window.visualViewport){ visualViewport.addEventListener('resize', fitToKeyboard); visualViewport.addEventListener('scroll', fitToKeyboard); }

const wordRe = new RegExp('\\b(' + PRIVATE_WORDS.map(w => w.replace(/ /g, '\\s+')).join('|') + ')\\b', 'i');

function privacySuggestions(){

    if (e.cat && wordRe.test(e.cat)){ cats.set(e.cat, (cats.get(e.cat) || 0) + 1); continue; }

    if (m){ const w = title1(m[1].replace(/\s+/g, ' ')); const g = moves.get(w) || {word: w, ids: []}; g.ids.push(e.id); moves.set(w, g); }

  return {cats: [...cats.entries()].map(([c, n]) => ({c, n})), moves: [...moves.values()]};

/* PIN screen */
const Pin = {mode: null, stage: 0, buf: '', first: '', code: '', msg: '', bad: false, fails: 0, until: 0, resolve: null};
const hex = b => [...b].map(x => x.toString(16).padStart(2, '0')).join('');
const unhex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
const randHex = n => hex(crypto.getRandomValues(new Uint8Array(n)));
async function slowHash(text, saltHex){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(text), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name: 'PBKDF2', salt: unhex(saltHex), iterations: 200000, hash: 'SHA-256'}, key, 256);
  return hex(new Uint8Array(bits));
}
function newRecoveryCode(){ const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = crypto.getRandomValues(new Uint8Array(10)); const c = [...r].map(x => A[x % A.length]).join(''); return c.slice(0,5) + '-' + c.slice(5); }
const normCode = c => (c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
function askPin(mode){
  return new Promise(res => {
    if (Pin.resolve) Pin.resolve(false);
    Object.assign(Pin, {mode, stage: 0, buf: '', first: '', code: '', msg: '', bad: false, resolve: res});
    if ($('#pin').hidden) pushLayer('pin');
    $('#pin').hidden = false; pinRender();
  });
}
function pinDone(ok, fromBack){ if (!fromBack) popLayer('pin'); $('#pin').hidden = true; const r = Pin.resolve; Object.assign(Pin, {resolve: null, mode: null, buf: '', first: '', code: ''}); r && r(ok); }
function pinRender(){
  const card = $('#pin-card'), s = getSettings(), m = Pin.mode;
  const sub = t => `<p class="sub${Pin.bad ? ' bad' : ''}">${t}</p>`;
  const head = (h) => `<div class="pin-ic">${ICON.lock}</div><h2 id="pin-title">${h}</h2>`;
  const pad = (ok) => `<div class="pad">${['1','2','3','4','5','6','7','8','9', ok ? 'ok' : '', '0','del'].map(k => k ? `<button data-act="pinkey" data-k="${k}" aria-label="${k === 'del' ? 'Delete digit' : k === 'ok' ? 'Done' : k}">${k === 'del' ? ICON.del : k === 'ok' ? '✓' : k}</button>` : '<span></span>').join('')}</div>`;
  if (m === 'unlock'){
    const len = s.pinLen || 4;
    card.innerHTML = head('Enter your PIN') + sub(esc(Pin.msg)) + `<div class="pin-dots" id="pin-dots">${Array.from({length: len}, (_, i) => `<i class="${i < Pin.buf.length ? 'on' : ''}"></i>`).join('')}</div>` + pad(false)
      + `<div class="pin-foot"><button class="link" data-act="pincancel">Cancel</button><button class="link" data-act="pinforgot">Forgot PIN?</button></div>`;
  } else if (m === 'setup'){
    const t = Pin.first ? 'Enter it again' : 'Choose a PIN';
    card.innerHTML = head(t) + sub(esc(Pin.msg || (Pin.first ? 'Same digits, then tap ✓' : '4 to 6 digits, then tap ✓')))
      + `<div class="pin-dots" id="pin-dots">${Array.from({length: Math.max(4, Pin.buf.length)}, (_, i) => `<i class="${i < Pin.buf.length ? 'on' : ''}"></i>`).join('')}</div>` + pad(true)
      + `<div class="pin-foot"><button class="link" data-act="pincancel">Cancel</button><span></span></div>`;
  } else if (m === 'code'){
    card.innerHTML = head('Save your recovery code') + `<p class="sub">If you ever forget your PIN, this code lets you set a new one. Screenshot it or write it down somewhere safe.</p>`
      + `<div class="code">${esc(Pin.code)}</div><button class="btn primary wide" data-act="pincodeok">I've saved it</button>`;
  } else if (m === 'recover'){
    card.innerHTML = head('Forgot your PIN?') + sub(esc(Pin.msg || 'Enter the recovery code you saved when you set the PIN.'))
      + `<input class="inp" id="rec-in" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX" style="text-align:center;font-size:20px;letter-spacing:.08em">`
      + `<button class="btn primary wide" data-act="pinrecover">Reset PIN</button>`
      + `<div class="pin-foot"><button class="link" data-act="pincancel">Cancel</button><button class="link" data-act="pinnocode">I don't have the code</button></div>`;
  } else if (m === 'reset'){
    const n = S.everything.filter(e => isPrivate(e)).length;

      + `<button class="btn danger wide" data-act="pinwipe">Delete private entries and reset</button>`
      + `<div class="pin-foot"><button class="link" data-act="pincancel">Cancel</button><span></span></div>`;
  }

function pinFail(msg){ Pin.msg = msg; Pin.bad = true; Pin.buf = ''; pinRender(); const d = $('#pin-dots'); d && shake(d); buzz(); }
async function pinKey(k){
  if (Pin.mode !== 'unlock' && Pin.mode !== 'setup') return;
  if (Date.now() < Pin.until){ pinFail('Too many tries. Wait a few seconds.'); return; }
  if (k === 'del'){ Pin.buf = Pin.buf.slice(0, -1); pinRender(); return; }
  if (k === 'ok'){ if (Pin.mode === 'setup') await pinSetupNext(); return; }
  if (Pin.buf.length >= 6) return;
  Pin.buf += k; Pin.msg = ''; pinRender();
  if (Pin.mode === 'unlock' && Pin.buf.length === (getSettings().pinLen || 4)){
    const s = getSettings();
    if (await slowHash(Pin.buf, s.salt) === s.pinHash){ Pin.fails = 0; pinDone(true); }
    else { Pin.fails++; if (Pin.fails >= 5){ Pin.fails = 0; Pin.until = Date.now() + 30000; pinFail('Too many tries. Wait 30 seconds.'); } else pinFail('Wrong PIN. Try again.'); }
  }
}
async function pinSetupNext(){
  if (Pin.buf.length < 4){ pinFail('Use at least 4 digits'); return; }
  if (!Pin.first){ Pin.first = Pin.buf; Pin.buf = ''; Pin.msg = ''; pinRender(); return; }
  if (Pin.buf !== Pin.first){ Pin.first = ''; pinFail("Those didn't match. Choose your PIN again."); return; }
  const salt = randHex(16), recSalt = randHex(16), code = newRecoveryCode();
  const [pinHash, recHash] = await Promise.all([slowHash(Pin.buf, salt), slowHash(normCode(code), recSalt)]);
  await saveSettings({pinHash, salt, pinLen: Pin.buf.length, recHash, recSalt, privateCats: getSettings().privateCats || []});
  Pin.mode = 'code'; Pin.code = code; Pin.buf = ''; Pin.first = ''; pinRender();
}
async function pinRecover(){
  const s = getSettings(), v = normCode($('#rec-in') && $('#rec-in').value);
  if (!v){ return; }
  if (s.recHash && await slowHash(v, s.recSalt) === s.recHash){ Object.assign(Pin, {mode: 'setup', buf: '', first: '', msg: 'Code accepted. Choose a new PIN.'}); pinRender(); }
  else { Pin.msg = "That code doesn't match."; Pin.bad = true; pinRender(); }
}
async function pinWipe(){
  const ids = S.everything.filter(e => isPrivate(e)).map(e => e.id);
  if (ids.length) await store.removeMany(ids);
  await saveSettings({pinHash: null, salt: null, pinLen: null, recHash: null, recSalt: null, privateCats: []});
  pinDone(false); remount(); toast('Private entries deleted. You can set a new PIN in settings.');
}
